<!DOCTYPE html>

<head>

  <style>

    @media(max-width:1600px){.top-metrics-row{grid-template-columns:repeat(5,minmax(0,1fr))}}
    @media(max-width:720px){.grid-main,.grid-bottom,.grid-extra,.qgrid{grid-template-columns:1fr}.grid-main .card,.grid-bottom .card{height:auto;min-height:520px}.road-list,.metrics,.team-stats,.mix,.bugs{grid-template-columns:repeat(2,minmax(0,1fr))}}

    :root{--primary:#0052d9;--primary-light:#3d7dff;--primary-dark:#003a99;--primary-soft:#e8f0ff;--primary-soft-strong:#cfe0ff;--accent:#79a8ff;--bg:#f5f8fe;--card:#fff;--text:#0f172a;--sub:#526077;--muted:#8c97aa;--border:#dde5ef;--ok:#2f7bff;--warn:#d97706;--danger:#dc2626}

    .top-metric-card.blue .v,.metric.blue .v,.bug.minor .v,.box.fe .b{color:var(--primary)!important}
    .top-metric-card.purple .v,.metric.purple .v,.box.be .b{color:var(--primary-dark)!important}
    .top-metric-card.green .v,.metric.green .v,.bug.resolved .v,.box.qa .b{color:var(--primary-light)!important}
    .tag.good{color:var(--primary)!important;border-color:var(--primary-soft-strong)!important;background:var(--primary-soft)!important}
    .m.done{background:var(--primary-soft)!important;border-color:var(--primary-soft-strong)!important}
    .m.active{background:#f2f7ff!important;border-color:#dbe8ff!important}
  </style>

    let state=JSON.parse(JSON.stringify(defaultState)),activeTab="upstream",updateTime="",importedFileName="";
    const esc=(v)=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");

    const statusClass=(v)=>{const t=toText(v,"").toLowerCase();if(["warn","关注","预警"].includes(t))return"warn";if(["risk","风险","异常"].includes(t))return"risk";return"good"};

      const qStats=qualityStats(state.quality.rows),tStats=teamStats(state.team.rows),structure=teamStructure(state.team.rows);
      const topMetricsHtml=state.topMetrics.map((i)=>`<div class="top-metric-card ${esc(i.cls)}"><div class="l">${esc(i.label)}</div><div class="v">${esc(i.value)}</div><div class="d">${esc(i.desc)}</div></div>`).join("");
      const roadmapHtml=state.roadmap.map((r)=>`<div class="road"><div class="road-top"><div><h3>${esc(r.product)}</h3><div class="meta-line"><span>负责人：${esc(r.owner)}</span><span>当前阶段：${esc(r.phase)}</span><span>下一节点：${esc(r.next)}</span></div></div><span class="tag ${esc(r.health)}">${esc(r.healthLabel)}</span></div><div class="ph"><span>年度关键里程碑完成度</span><strong>${Math.round(toNumber(r.progress))}%</strong></div><div class="track"><div class="fill" style="width:${Math.round(toNumber(r.progress))}%"></div></div><div class="mile">${r.milestones.map((m)=>`<div class="m ${esc(m.status||"")}"><div class="q">${esc(m.quarter)}</div><div class="ver">${esc(m.version)}</div><div class="txt">${esc(m.desc)}</div></div>`).join("")}</div><div class="chips">${r.focus.map((f)=>`<span class="chip">${esc(f)}</span>`).join("")}</div></div>`).join("");
      const businessMetricsHtml=businessMetrics(activeTab).map((i)=>`<div class="metric"><div class="l">${esc(i.label)}</div><div class="v">${esc(i.value)}</div><div class="d">${esc(i.desc)}</div></div>`).join("");
      const businessTableHtml=activeTab==="upstream"
        ? `<table><thead><tr><th>产品</th><th>商机引用数</th><th>在途金额</th><th>需求匹配度</th><th>关联项目</th><th>预计营收</th><th>经营关注点</th></tr></thead><tbody>${state.business.upstreamRows.map((r)=>`<tr><td><strong>${esc(r.product)}</strong></td><td>${Math.round(toNumber(r.opportunityCount))}</td><td>${esc(formatWan(r.amount))}</td><td>${fitBar(r.fit)}</td><td>${Math.round(toNumber(r.relatedProjects))}</td><td>${esc(formatWan(r.revenue))}</td><td>${esc(r.note)}</td></tr>`).join("")}</tbody></table>`
        : `<table><thead><tr><th>重点项目</th><th>关联产品</th><th>项目进度</th><th>产品匹配度</th><th>预计营收</th><th>关键节点</th><th>状态</th></tr></thead><tbody>${state.business.downstreamRows.map((r)=>`<tr><td><strong>${esc(r.project)}</strong></td><td>${esc(r.product)}</td><td>${fitBar(r.progress)}</td><td>${Math.round(toNumber(r.fit))}%</td><td>${esc(formatWan(r.revenue))}</td><td>${esc(r.node)}</td><td><span class="tag ${esc(r.status)}">${statusLabel(r.status)}</span></td></tr>`).join("")}</tbody></table>`;
      const qualityTableHtml=state.quality.rows.map((r)=>{const total=toNumber(r.blocker)+toNumber(r.major)+toNumber(r.minor)||1;return `<tr><td><strong>${esc(r.product)}</strong></td><td><div class="stack"><span class="b1" style="width:${toNumber(r.blocker)/total*100}%"></span><span class="b2" style="width:${toNumber(r.major)/total*100}%"></span><span class="b3" style="width:${toNumber(r.minor)/total*100}%"></span></div></td><td>${Math.round(toNumber(r.blocker))}</td><td>${Math.round(toNumber(r.major))}</td><td>${Math.round(toNumber(r.minor))}</td><td>${Math.round(toNumber(r.closeRate))}%</td><td>${esc(r.owner)}</td></tr>`}).join("");
      const qualityFocusHtml=state.quality.items.map((i)=>`<div class="item"><div class="t">${esc(i.title)}</div><div class="d">${esc(i.desc)}</div></div>`).join("");
      const teamStatsHtml=tStats.map((i)=>`<div class="team-stat"><div class="v">${esc(i.value)}</div><div class="l">${esc(i.label)}</div></div>`).join("");
      const teamTableHtml=state.team.rows.map((r)=>`<tr><td><strong>${esc(r.product)}</strong></td><td>${Math.round(toNumber(r.pm))}</td><td>${Math.round(toNumber(r.fe))}</td><td>${Math.round(toNumber(r.be))}</td><td>${Math.round(toNumber(r.qa))}</td><td>${Math.round(toNumber(r.total,toNumber(r.pm)+toNumber(r.fe)+toNumber(r.be)+toNumber(r.qa)))}</td><td>${fitBar(r.efficiency)}</td></tr>`).join("");
      const structureHtml=structure.map((i)=>`<div class="box ${esc(i.cls)}"><div class="s">${esc(i.label)}</div><div class="b">${esc(i.value)}</div></div>`).join("");
      const teamFocusHtml=state.team.items.map((i)=>`<div class="item"><div class="t">${esc(i.title)}</div><div class="d">${esc(i.desc)}</div></div>`).join("");
      const app=document.getElementById("app");
      app.innerHTML=`<div class="topbar"><div class="detail-meta"><span>所属部门：<strong>产品研发部</strong></span><span>更新时间：<strong>${esc(updateTime)}</strong></span></div><div class="actions">${importedFileName?`<span class="file-indicator">${esc(importedFileName)}</span>`:""}<a class="btn btn-outline" href="../作战室数据导入模板/产品研发部-数据导入模板V2.xlsx" download><span>↓</span><span>下载模板</span></a><input id="fileInput" type="file" accept=".xls,.xlsx" style="display:none"><button id="importBtn" class="btn btn-primary" type="button"><span>📤</span><span>导入周报数据</span></button></div></div><section class="top-metrics-row">${topMetricsHtml}</section><section class="grid-main"><div class="card"><div class="ch"><div><div class="ct">产品路标 <span class="pill">关键产品 roadmap 进度</span></div><div class="cs">按季度重组版本节点、健康状态与关键关注项，支持模块内滚动查看。</div></div></div><div class="cb"><div class="scroll-zone"><div class="road-list">${roadmapHtml}</div></div></div></div><div class="card"><div class="ch"><div><div class="ct">产品经营 <span class="pill">商机引用与项目关联</span></div><div class="cs">同屏查看上游商机转化和重点项目绑定产品后的营收贡献。</div></div></div><div class="cb"><div class="tabs"><button class="tab-btn ${activeTab==="upstream"?"active":""}" data-tab="upstream" type="button">商机经营</button><button class="tab-btn ${activeTab==="downstream"?"active":""}" data-tab="downstream" type="button">项目关联</button></div><div class="metrics">${businessMetricsHtml}</div><div class="scroll biz-table-wrap">${businessTableHtml}</div></div></div></section><section class="grid-bottom"><div class="card"><div class="ch"><div><div class="ct">产品质量总览 <span class="pill">按产品统计当前 Bug 数</span></div><div class="cs">按阻塞级、严重级、一般级拆分，保留所有质量关注点说明。</div></div></div><div class="cb"><div class="bugs">${qStats.map((i)=>`<div class="bug ${esc(i.cls)}"><div class="l">${esc(i.label)}</div><div class="v">${esc(i.value)}</div></div>`).join("")}</div><div class="qgrid"><div class="scroll quality-main-scroll"><table><thead><tr><th>产品</th><th>严重度分布</th><th>阻塞</th><th>严重</th><th>一般</th><th>关闭率</th><th>质量负责人</th></tr></thead><tbody>${qualityTableHtml}</tbody></table></div><div class="list side-scroll">${qualityFocusHtml}</div></div></div></div><div class="card"><div class="ch"><div><div class="ct">产品研发团队概览 <span class="pill">产品、人力与平均人效</span></div><div class="cs">聚焦产品经理、前后端、QA 与平均人效，和一级页面统计口径保持一致。</div></div></div><div class="cb"><div class="team-stats">${teamStatsHtml}</div><div class="scroll team-main-scroll"><table><thead><tr><th>产品</th><th>产品经理</th><th>前端</th><th>后端</th><th>QA</th><th>总人数</th><th>平均人效</th></tr></thead><tbody>${teamTableHtml}</tbody></table></div></div></div></section><section class="grid-extra"><div class="card"><div class="ch"><div><div class="ct">研发结构占比</div><div class="cs">根据团队明细自动汇总前端、后端、QA 占比。</div></div></div><div class="cb"><div class="panel"><div class="mix">${structureHtml}</div></div></div></div><div class="card"><div class="ch"><div><div class="ct">团队关注点</div><div class="cs">保留团队观察、资源风险和组织建议，支持继续扩充导入。</div></div></div><div class="cb"><div class="list">${teamFocusHtml}</div></div></div></section>`;
      document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("fileInput").click());
      document.getElementById("fileInput").addEventListener("change",handleFileUpload);
      document.querySelectorAll(".tab-btn").forEach((btn)=>btn.addEventListener("click",()=>{activeTab=btn.dataset.tab;render();}));
    }
    function handleFileUpload(e){
      const file=e.target.files[0]; if(!file)return; if(typeof XLSX==="undefined"){alert("未检测到 Excel 解析组件，请检查网络后重试。");return;}
      const reader=new FileReader();
      reader.onload=(event)=>{try{const workbook=XLSX.read(event.target.result,{type:"binary"}),nextState=JSON.parse(JSON.stringify(defaultState));
        const topSheet=getSheetName(workbook,["顶部指标"]); if(topSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[topSheet],{defval:""}).filter((r)=>toText(r["标签"])); if(rows.length)nextState.topMetrics=rows.map((r)=>({label:toText(r["标签"]),value:toText(r["值"]),desc:toText(r["描述"]),cls:metricClass(r["颜色"])}));}
        const roadmapSheet=getSheetName(workbook,["产品路标"]); if(roadmapSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[roadmapSheet],{defval:""}).filter((r)=>toText(r["产品"])); if(rows.length)nextState.roadmap=rows.map((r)=>({product:toText(r["产品"]),owner:toText(r["负责人"]),phase:toText(r["当前阶段"]),progress:toNumber(r["进度"]),health:statusClass(r["健康状态"]),healthLabel:toText(r["健康标签"],statusLabel(statusClass(r["健康状态"]))),next:toText(r["下一节点"]),milestones:[1,2,3,4].map((i)=>({quarter:`Q${i}`,version:toText(r[`Q${i}版本`]),desc:toText(r[`Q${i}说明`]),status:toText(r[`Q${i}状态`])})),focus:[r["关注点1"],r["关注点2"],r["关注点3"]].map((v)=>toText(v)).filter(Boolean)}));}
        const upstreamSheet=getSheetName(workbook,["商机经营"]); if(upstreamSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[upstreamSheet],{defval:""}).filter((r)=>toText(r["产品"])); if(rows.length)nextState.business.upstreamRows=rows.map((r)=>({product:toText(r["产品"]),opportunityCount:toNumber(r["商机引用数"]),amount:toNumber(r["在途金额"]),fit:toNumber(r["需求匹配度"]),relatedProjects:toNumber(r["关联项目数"]),revenue:toNumber(r["预计营收"]),note:toText(r["经营关注点"])}));}
        const downstreamSheet=getSheetName(workbook,["项目关联"]); if(downstreamSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[downstreamSheet],{defval:""}).filter((r)=>toText(r["重点项目"])); if(rows.length)nextState.business.downstreamRows=rows.map((r)=>({project:toText(r["重点项目"]),product:toText(r["关联产品"]),progress:toNumber(r["项目进度"]),fit:toNumber(r["产品匹配度"]),revenue:toNumber(r["预计营收"]),node:toText(r["关键节点"]),status:statusClass(r["状态"])}));}
        const qualitySheet=getSheetName(workbook,["质量明细"]); if(qualitySheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[qualitySheet],{defval:""}).filter((r)=>toText(r["产品"])); if(rows.length)nextState.quality.rows=rows.map((r)=>({product:toText(r["产品"]),blocker:toNumber(r["阻塞"]),major:toNumber(r["严重"]),minor:toNumber(r["一般"]),closeRate:toNumber(r["关闭率"]),owner:toText(r["负责人"])}));}
        const qualityFocusSheet=getSheetName(workbook,["质量关注点"]); if(qualityFocusSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[qualityFocusSheet],{defval:""}).filter((r)=>toText(r["标题"])); if(rows.length)nextState.quality.items=rows.map((r)=>({title:toText(r["标题"]),desc:toText(r["说明"])}));}
        const teamSheet=getSheetName(workbook,["团队明细"]); if(teamSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[teamSheet],{defval:""}).filter((r)=>toText(r["产品"])); if(rows.length)nextState.team.rows=rows.map((r)=>{const pm=toNumber(r["产品经理"]),fe=toNumber(r["前端"]),be=toNumber(r["后端"]),qa=toNumber(r["QA"]); return{product:toText(r["产品"]),pm,fe,be,qa,total:toNumber(r["总人数"],pm+fe+be+qa),efficiency:toNumber(r["平均人效"])}});}
        const teamFocusSheet=getSheetName(workbook,["团队关注点"]); if(teamFocusSheet){const rows=XLSX.utils.sheet_to_json(workbook.Sheets[teamFocusSheet],{defval:""}).filter((r)=>toText(r["标题"])); if(rows.length)nextState.team.items=rows.map((r)=>({title:toText(r["标题"]),desc:toText(r["说明"])}));}
        state=nextState; updateTime=formatTime(); importedFileName=file.name; render();
      }catch(error){console.error(error);alert("导入失败，请检查 Excel 模板字段是否与产品研发部 V2 模板一致。");}};
      reader.readAsBinaryString(file);
    }
    updateTime=formatTime(); render();
  </script>
