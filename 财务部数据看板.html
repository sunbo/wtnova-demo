<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务情况详情</title>
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --accent-color: #06b6d4;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .page-container {
            padding: 16px;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--primary-color);
        }

        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            text-decoration: none;
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .file-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--success-color);
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 第一行：三列布局 */
        .row-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        /* 第二行：三列布局 */
        .row-two {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            align-items: stretch;
        }

        .row-two .card {
            display: flex;
            flex-direction: column;
        }

        .row-two .card .card-body {
            flex: 1;
            overflow-y: auto;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-title .icon {
            font-size: 16px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-body {
            padding: 14px 16px;
        }

        /* 核心指标卡片 */
        .metric-card {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 10px;
        }

        .metric-card:last-child {
            margin-bottom: 0;
        }

        .metric-card .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .metric-card .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .metric-card .metric-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .metric-card .metric-badge.up {
            background: #d1fae5;
            color: #059669;
        }

        .metric-card .metric-badge.down {
            background: #fee2e2;
            color: #dc2626;
        }

        .metric-card .metric-badge.neutral {
            background: #e0e7ff;
            color: #4338ca;
        }

        .metric-card .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .metric-card .metric-value .unit {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .metric-card .metric-detail {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .metric-card .metric-detail span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 统计网格 */
        .stats-grid {
            display: grid;
            gap: 12px;
        }

        .stats-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .stats-grid.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .stats-grid.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        /* 大统计卡片 */
        .stat-card {
            padding: 14px;
            border-radius: var(--radius-md);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .stat-card.purple {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
        }

        .stat-card.cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        }

        .stat-card.emerald {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .stat-card.amber {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stat-card.rose {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        }

        .stat-card.blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .stat-card .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .stat-card .stat-value {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-card .stat-unit {
            font-size: 13px;
            opacity: 0.9;
            margin-left: 2px;
        }

        .stat-card .stat-trend {
            font-size: 11px;
            margin-top: 6px;
            opacity: 0.9;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -30%;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        /* 资金预警 */
        .fund-warning {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            margin-top: 12px;
        }

        .fund-warning.safe {
            background: #f0fdf4;
            border: 1px solid #86efac;
        }

        .fund-warning.warning {
            background: #fffbeb;
            border: 1px solid #fcd34d;
        }

        .fund-warning.danger {
            background: #fef2f2;
            border: 1px solid #fca5a5;
        }

        .fund-warning .warning-icon {
            font-size: 24px;
        }

        .fund-warning .warning-content {
            flex: 1;
        }

        .fund-warning .warning-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .fund-warning.safe .warning-title {
            color: #059669;
        }

        .fund-warning.warning .warning-title {
            color: #d97706;
        }

        .fund-warning.danger .warning-title {
            color: #dc2626;
        }

        .fund-warning .warning-desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 进度条 */
        .progress-bar-wrapper {
            margin-top: 8px;
        }

        .progress-bar-wrapper .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .progress-bar .progress-fill.green {
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .progress-bar .progress-fill.amber {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .progress-bar .progress-fill.red {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th {
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-primary);
        }

        .data-table tr:hover td {
            background: #fafbfc;
        }

        .data-table .text-center {
            text-align: center;
        }

        .data-table .text-right {
            text-align: right;
        }

        .data-table .amount {
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 状态标签 */
        .status-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-tag.success {
            background: #d1fae5;
            color: #059669;
        }

        .status-tag.warning {
            background: #fef3c7;
            color: #d97706;
        }

        .status-tag.danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-tag.info {
            background: #dbeafe;
            color: #2563eb;
        }

        /* 回款状态 */
        .payment-status {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .payment-status-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: #f8fafc;
        }

        .payment-status-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .payment-status-item .dot.green {
            background: #10b981;
        }

        .payment-status-item .dot.amber {
            background: #f59e0b;
        }

        .payment-status-item .dot.red {
            background: #ef4444;
        }

        /* 成本占比条 */
        .cost-bar {
            display: flex;
            height: 24px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .cost-bar-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            font-weight: 500;
            min-width: 30px;
        }

        /* 风险预警列表 */
        .risk-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .risk-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
        }

        .risk-item.high {
            background: #fef2f2;
            border-left: 3px solid #ef4444;
        }

        .risk-item.medium {
            background: #fffbeb;
            border-left: 3px solid #f59e0b;
        }

        .risk-item.low {
            background: #f0fdf4;
            border-left: 3px solid #10b981;
        }

        .risk-item .risk-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .risk-item .risk-content {
            flex: 1;
        }

        .risk-item .risk-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .risk-item .risk-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* 表格滚动 */
        .table-scroll {
            max-height: 180px;
            overflow-y: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .table-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* 税务进度 */
        .tax-progress {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .tax-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            min-height: 88px;
            padding: 16px;
            background: #ffffff;
            border: 1px solid rgba(0, 82, 217, 0.12);
            border-radius: var(--radius-sm);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .tax-item .tax-name {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tax-item .tax-status {
            font-size: 24px !important;
            line-height: 1 !important;
            font-weight: 700 !important;
            color: var(--primary-color) !important;
        }

        .tax-item .status-tag {
            padding: 0;
            border: none;
            background: transparent !important;
            color: inherit !important;
            box-shadow: none;
            font-size: inherit !important;
            line-height: inherit !important;
            font-weight: inherit !important;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .row-three {
                grid-template-columns: 1fr 1fr;
            }

            .stats-grid.cols-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 900px) {
            .row-three {
                grid-template-columns: 1fr;
            }

            .row-two {
                grid-template-columns: 1fr;
            }

            .stats-grid.cols-3 {
                grid-template-columns: repeat(2, 1fr);
            }

            .tax-progress {
                grid-template-columns: 1fr;
            }
        }
        /* V3 unified compact detail style */
        :root {
            --primary-color: #2563eb;
            --primary-light: #60a5fa;
            --primary-dark: #1d4ed8;
            --accent-color: #0891b2;
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #526077;
            --text-muted: #8c97aa;
            --border-color: #dde5ef;
            --success-color: #0f9f6e;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 16px 40px -28px rgba(15, 23, 42, 0.28);
            --shadow-lg: 0 20px 48px -32px rgba(15, 23, 42, 0.3);
            --radius-sm: 10px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            background: var(--bg-color) !important;
            font-size: 12px;
            line-height: 1.42;
        }

        .page-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 12px !important;
        }

        .top-bar {
            margin-bottom: 10px;
            padding-bottom: 8px;
            min-height: 28px;
        }

        .page-heading,
        .detail-meta,
        .actions,
        .btn,
        .card-subtitle,
        .file-indicator {
            font-size: 10px !important;
        }

        .page-heading {
            font-size: 13px !important;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            color: var(--text-secondary);
            line-height: 1.2;
        }

        .detail-meta strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        .btn {
            padding: 6px 10px;
            border-radius: 999px;
        }

        .btn-primary {
            background: #0f172a !important;
            box-shadow: none !important;
        }

        .file-indicator {
            background: #f8fafc !important;
            border-color: var(--border-color) !important;
            color: var(--text-secondary) !important;
        }

        .main-content,
        .row-three,
        .row-two {
            gap: 10px !important;
        }

        .card,
        .metric-card,
        .stat-card,
        .fund-warning,
        .risk-item {
            border-radius: 14px !important;
            border-color: var(--border-color) !important;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05) !important;
        }

        .card:hover {
            box-shadow: var(--shadow-sm) !important;
        }

        .card-header {
            padding: 10px 12px !important;
            background: #fbfdff !important;
        }

        .card-title {

            font-weight: 700 !important;
            gap: 0 !important;
        }

        .card-title .icon {
            display: none !important;
        }

        .card-body {
            padding: 10px 12px !important;
        }

        .card-subtitle,
        .metric-card .metric-label,
        .metric-card .metric-detail,
        .stat-card .stat-label,
        .stat-card .stat-trend,
        .risk-item .risk-desc,
        .table-title,
        .table-subtitle {
            font-size: 10px !important;
            line-height: 1.45 !important;
        }

        .metric-card {
            margin-bottom: 8px;
            padding: 10px !important;
            background: #f8fafc !important;
        }

        .metric-card .metric-label,
        .metric-card .metric-detail,
        .metric-card .metric-badge,
        th,
        td,
        .table-title,
        .table-subtitle {
            font-size: 10px !important;
        }

        .metric-card .metric-value {
            font-size: 20px !important;
            color: var(--text-primary) !important;
        }

        .metric-card .metric-value .unit,
        .stat-card .stat-unit {
            font-size: 12px !important;
            color: var(--text-muted) !important;
        }

        .metric-card .metric-badge.up {
            background: rgba(15, 159, 110, 0.1) !important;
            color: var(--success-color) !important;
        }

        .metric-card .metric-badge.down {
            background: rgba(220, 38, 38, 0.08) !important;
            color: var(--danger-color) !important;
        }

        .metric-card .metric-badge.neutral {
            background: rgba(37, 99, 235, 0.08) !important;
            color: var(--primary-color) !important;
        }

        .stats-grid {
            gap: 8px !important;
        }

        .stat-card {
            padding: 10px !important;
            background: #f8fafc !important;
            color: var(--text-primary) !important;
        }

        .stat-card::before {
            display: none !important;
        }

        .stat-card .stat-label,
        .stat-card .stat-trend,
        .progress-bar-wrapper .progress-label,
        .fund-warning .warning-desc,
        .payment-status-item,
        .tax-item,
        .risk-item .risk-desc,
        .section-label,
        .cost-legend,
        .cost-legend-item,
        .period-item-label,
        .budget-state,
        .tax-risk-item {
            font-size: 10px !important;
        }

        .stat-card .stat-value {
            font-size: 20px !important;
            color: var(--text-primary) !important;
        }

        .stat-card.emerald .stat-value {
            color: var(--success-color) !important;
        }

        .stat-card.blue .stat-value,
        .stat-card.cyan .stat-value {
            color: var(--primary-color) !important;
        }

        .stat-card.amber .stat-value {
            color: var(--warning-color) !important;
        }

        .stat-card.rose .stat-value {
            color: var(--danger-color) !important;
        }

        .stat-card.purple .stat-value {
            color: var(--primary-dark) !important;
        }

        .fund-warning {
            margin-top: 10px !important;
            padding: 10px !important;
            background: #f8fafc !important;
            border: 1px solid var(--border-color) !important;
            gap: 10px !important;
        }

        .fund-warning .warning-icon {
            font-size: 18px !important;
        }

        .fund-warning .warning-title {
            font-size: 12px !important;
            margin-bottom: 3px !important;
        }

        .fund-warning.safe .warning-title {
            color: var(--success-color) !important;
        }

        .fund-warning.warning .warning-title {
            color: var(--warning-color) !important;
        }

        .fund-warning.danger .warning-title {
            color: var(--danger-color) !important;
        }

        .progress-bar {
            height: 8px !important;
            background: #e6edf5 !important;
        }

        .progress-bar .progress-fill.green {
            background: linear-gradient(90deg, var(--success-color), #3bb18c) !important;
        }

        .progress-bar .progress-fill.amber {
            background: linear-gradient(90deg, var(--warning-color), #e9a04a) !important;
        }

        .progress-bar .progress-fill.red {
            background: linear-gradient(90deg, var(--danger-color), #ef6b6b) !important;
        }

        .section-label {
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .data-table th {
            padding: 7px 8px !important;
            background: #f8fafc !important;
        }

        .data-table td {
            padding: 8px !important;
        }

        .status-tag {
            padding: 3px 8px !important;
            border-radius: 999px !important;
            font-size: 10px !important;
            font-weight: 700 !important;
        }

        .status-tag.success {
            background: rgba(15, 159, 110, 0.1) !important;
            color: var(--success-color) !important;
        }

        .status-tag.warning {
            background: rgba(217, 119, 6, 0.1) !important;
            color: var(--warning-color) !important;
        }

        .status-tag.danger {
            background: rgba(220, 38, 38, 0.08) !important;
            color: var(--danger-color) !important;
        }

        .status-tag.info {
            background: rgba(37, 99, 235, 0.08) !important;
            color: var(--primary-color) !important;
        }

        .cost-bar {
            height: 12px !important;
            border-radius: 999px !important;
            overflow: hidden;
        }

        .cost-bar-segment {
            font-size: 10px !important;
        }

        .cost-legend {
            display: flex;
            gap: 16px;
            color: var(--text-secondary);
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .cost-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .cost-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .period-item {
            text-align: center;
            padding: 8px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .period-item-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .period-item-label {
            color: var(--text-muted);
            margin-top: 3px;
        }

        .budget-state {
            margin-top: 4px;
        }

        .budget-state.over {
            color: var(--danger-color);
        }

        .budget-state.save {
            color: var(--success-color);
        }

        .tax-risk-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #fff8ef;
            border: 1px solid rgba(217, 119, 6, 0.14);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .risk-item {
            background: #f8fafc !important;
            padding: 10px !important;
            gap: 8px !important;
        }

        .risk-item.high {
            border-left: 3px solid var(--danger-color) !important;
        }

        .risk-item.medium {
            border-left: 3px solid var(--warning-color) !important;
        }

        .risk-item.low {
            border-left: 3px solid var(--success-color) !important;
        }

        .risk-item .risk-icon {
            font-size: 14px !important;
        }

        .risk-item .risk-title {
            font-size: 11px !important;
            font-weight: 700 !important;
            margin-bottom: 3px !important;
        }

        table {
            font-size: 11px !important;
        }

        th {
            padding: 7px 8px !important;
            background: #f8fafc !important;
        }

        td {
            padding: 8px !important;
        }

        .card,
        .metric-card,
        .stat-card,
        .fund-warning,
        .risk-item,
        .tax-risk-item,
        .period-item {
            border-radius: 12px !important;
        }
        /* V3 detail hover/background sync */
        :root {
            --bg-color: #fafafa;
        }

        body {
            background: #fafafa !important;
        }

        .btn:hover,
        .btn-primary:hover,
        .btn-outline:hover,
        .card:hover,
        .stat-item:hover,
        .summary-item:hover,
        .metric-box:hover,
        .viz-panel:hover,
        .list-item:hover,
        .risk-item:hover,
        .opportunity-item:hover,
        .vacancy-item:hover,
        .project-row:hover,
        .payment-stat-item:hover,
        .opp-stat-item:hover,
        .bi-panel:hover,
        .dept-bi-row:hover,
        .rank-row:hover,
        .mini-summary-item:hover,
        .file-indicator:hover {
            background: #f5f5f5 !important;
            box-shadow: none !important;
        }

        .btn-primary:hover {
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
            transform: none !important;
        }

        .data-table tr:hover td,
        tr:hover td {
            background: #f5f5f5 !important;
        }
        :root {
            --primary-color: #0052d9;
            --primary-light: #3d7dff;
            --primary-dark: #003a99;
            --accent-color: #79a8ff;
            --primary-soft: #e8f0ff;
            --primary-soft-strong: #cfe0ff;
            --bg-color: #f5f8fe;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #526077;
            --text-muted: #8c97aa;
            --border-color: #dde5ef;
            --success-color: #2f7bff;
            --warning-color: #d97706;
            --danger-color: #dc2626;
        }
        .btn-primary{background:linear-gradient(135deg,var(--primary-color) 0%,var(--primary-dark) 100%) !important;border-color:var(--primary-color)!important}
        .btn-primary:hover{background:linear-gradient(135deg,var(--primary-color) 0%,var(--primary-dark) 100%) !important}
        .file-indicator{background:var(--primary-soft)!important;border-color:var(--primary-soft-strong)!important;color:var(--primary-color)!important}
        .metric-card .metric-badge.up,.metric-card .metric-badge.neutral,.status-tag.success,.status-tag.info{background:var(--primary-soft)!important;color:var(--primary-color)!important}
        .stat-card.purple,.stat-card.cyan,.stat-card.emerald,.stat-card.blue{
            background:#fff !important;
            border:1px solid var(--primary-soft-strong) !important;
            box-shadow:var(--shadow-sm) !important;
        }
        .stat-card.purple::before,.stat-card.cyan::before,.stat-card.emerald::before,.stat-card.blue::before{display:none !important}
        .stat-card.purple .stat-label,.stat-card.purple .stat-value,.stat-card.purple .stat-unit,.stat-card.purple .stat-trend,
        .stat-card.cyan .stat-label,.stat-card.cyan .stat-value,.stat-card.cyan .stat-unit,.stat-card.cyan .stat-trend,
        .stat-card.emerald .stat-label,.stat-card.emerald .stat-value,.stat-card.emerald .stat-unit,.stat-card.emerald .stat-trend,
        .stat-card.blue .stat-label,.stat-card.blue .stat-value,.stat-card.blue .stat-unit,.stat-card.blue .stat-trend{
            color:var(--primary-color) !important;
            opacity:1 !important;
        }
        .fund-warning.safe{background:var(--primary-soft)!important;border-color:var(--primary-soft-strong)!important}
        .fund-warning.safe .warning-title{color:var(--primary-color)!important}
        .progress-bar .progress-fill.green{background:linear-gradient(90deg,var(--primary-color),var(--primary-light)) !important}
        .payment-status-item .dot.green{background:var(--primary-color)!important}
        .risk-item.low{background:var(--primary-soft)!important;border-left-color:var(--primary-color)!important}
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- SheetJS -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="text/babel">
        const { useState, useRef } = React;

        // 默认核心盈利数据
        const defaultProfitData = {
            revenue: {
                value: 286,
                yoyChange: 12.5,
                momChange: 8.3,
                targetRate: 95
            },
            netProfit: {
                value: 68,
                rate: 23.8
            },
            grossProfit: {
                value: 142,
                cost: 144,
                rate: 49.7
            }
        };

        // 默认现金流数据
        const defaultCashFlowData = {
            available: 156,
            inflow: 185,
            outflow: 162,
            netFlow: 23,
            forecast: {
                hasGap: false,
                months: 3.2,
                nextMonthIn: 150,
                nextMonthOut: 145
            }
        };

        // 默认应收款数据
        const defaultReceivableData = {
            total: 428,
            overdue: {
                amount: 86,
                rate: 20.1,
                customers: [
                    { name: '东方锅炉', amount: 35, days: 45 },
                    { name: '中车风电', amount: 28, days: 32 },
                    { name: '华能集团', amount: 15, days: 15 }
                ]
            },
            collection: {
                target: 200,
                actual: 158,
                rate: 79,
                received: 120,
                pending: 38,
                overdueAmount: 42
            }
        };

        // 默认成本费用数据
        const defaultCostData = {
            laborCost: { value: 98, rate: 34.3 },
            serviceCost: { value: 46, rate: 16.1 },
            periodCost: {
                rent: 18,
                office: 8,
                tax: 24
            },
            budget: {
                actual: 194,
                budget: 210,
                status: 'save',
                diff: 16
            }
        };

        // 默认税务数据
        const defaultTaxData = {
            vat: { amount: 28, rate: 9.8, status: '已申报' },
            income: { amount: 15, rate: 5.2, status: '已申报' },
            risks: ['进项发票不足', '部分费用无发票']
        };

        // 默认风险预警数据
        defaultTaxData.invoiceIssued = 320;
        defaultTaxData.invoiceReceived = 186;

        const defaultRiskData = [
            { level: 'high', title: '大额逾期应收款', desc: '东方锅炉逾期45天，金额35万元，需重点跟进' },
            { level: 'medium', title: '资金缺口预警', desc: '下月预计流入150万，流出145万，资金基本平衡' },
            { level: 'low', title: '费用控制良好', desc: '本期费用194万，预算210万，节约16万元' },
            { level: 'medium', title: '核心收入波动', desc: '环比增长8.3%，同比增12.5%，整体向好' }
        ];

        // 核心盈利指标卡片
        const ProfitCard = ({ data }) => {
            const getBadgeClass = (change) => {
                if (change > 0) return 'up';
                if (change < 0) return 'down';
                return 'neutral';
            };

            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">💰</span>
                            核心盈利指标
                        </div>
                        <span className="card-subtitle">本期数据</span>
                    </div>
                    <div className="card-body">
                        <div className="metric-card">
                            <div className="metric-header">
                                <span className="metric-label">技术支持服务费收入</span>
                                <span className={`metric-badge ${getBadgeClass(data.revenue.momChange)}`}>
                                    {data.revenue.momChange > 0 ? '↑' : '↓'} {Math.abs(data.revenue.momChange)}%
                                </span>
                            </div>
                            <div className="metric-value">{data.revenue.value}<span className="unit">万元</span></div>
                            <div className="metric-detail">
                                <span>同比 {data.revenue.yoyChange > 0 ? '+' : ''}{data.revenue.yoyChange}%</span>
                                <span>目标达成率 {data.revenue.targetRate}%</span>
                            </div>
                        </div>

                        <div className="metric-card">
                            <div className="metric-header">
                                <span className="metric-label">净利润</span>
                                <span className="metric-badge neutral">净利润率 {data.netProfit.rate}%</span>
                            </div>
                            <div className="metric-value">{data.netProfit.value}<span className="unit">万元</span></div>
                            <div className="metric-detail">
                                <span>净利润 = 收入 - 成本 - 费用</span>
                            </div>
                        </div>

                        <div className="metric-card">
                            <div className="metric-header">
                                <span className="metric-label">技术服务毛利</span>
                                <span className="metric-badge up">毛利率 {data.grossProfit.rate}%</span>
                            </div>
                            <div className="metric-value">{data.grossProfit.value}<span className="unit">万元</span></div>
                            <div className="metric-detail">
                                <span>直接成本 {data.grossProfit.cost}万</span>
                                <span>（人工+耗材）</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 现金流状况卡片
        const CashFlowCard = ({ data }) => {
            const warningClass = data.forecast.hasGap ? 'danger' : (data.forecast.months < 2 ? 'warning' : 'safe');
            const warningIcon = data.forecast.hasGap ? '⚠️' : (data.forecast.months < 2 ? '⚡' : '✅');
            const warningTitle = data.forecast.hasGap ? '资金缺口预警' : (data.forecast.months < 2 ? '资金紧张' : '资金充足');

            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">💵</span>
                            现金流状况
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="stats-grid cols-2">
                            <div className="stat-card emerald">
                                <div className="stat-label">当前可用资金</div>
                                <div className="stat-value">{data.available}<span className="stat-unit">万</span></div>
                                <div className="stat-trend">银行账户余额合计</div>
                            </div>
                            <div className="stat-card blue">
                                <div className="stat-label">资金净流量</div>
                                <div className="stat-value">{data.netFlow > 0 ? '+' : ''}{data.netFlow}<span className="stat-unit">万</span></div>
                                <div className="stat-trend">流入{data.inflow}万 - 流出{data.outflow}万</div>
                            </div>
                        </div>

                        <div className={`fund-warning ${warningClass}`}>
                            <span className="warning-icon">{warningIcon}</span>
                            <div className="warning-content">
                                <div className="warning-title">{warningTitle}</div>
                                <div className="warning-desc">
                                    可支撑运营时长：<strong>{data.forecast.months}</strong> 个月 |
                                    下月预计流入{data.forecast.nextMonthIn}万，流出{data.forecast.nextMonthOut}万
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 应收款管理卡片
        const ReceivableCard = ({ data }) => {
            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">📋</span>
                            应收款管理
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="stats-grid cols-3">
                            <div className="stat-card rose">
                                <div className="stat-label">应收款总额</div>
                                <div className="stat-value">{data.total}<span className="stat-unit">万</span></div>
                            </div>
                            <div className="stat-card amber">
                                <div className="stat-label">逾期金额</div>
                                <div className="stat-value">{data.overdue.amount}<span className="stat-unit">万</span></div>
                                <div className="stat-trend">逾期率 {data.overdue.rate}%</div>
                            </div>
                            <div className="stat-card cyan">
                                <div className="stat-label">回款率</div>
                                <div className="stat-value">{data.collection.rate}<span className="stat-unit">%</span></div>
                                <div className="stat-trend">{data.collection.actual}/{data.collection.target}万</div>
                            </div>
                        </div>

                        <div style={{ marginTop: '12px' }}>
                            <div className="section-label">重点逾期客户</div>
                            <div className="table-scroll" style={{ maxHeight: '100px' }}>
                                <table className="data-table">
                                    <thead>
                                        <tr>
                                            <th>客户名称</th>
                                            <th className="text-right">金额</th>
                                            <th className="text-center">逾期天数</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data.overdue.customers.map((item, idx) => (
                                            <tr key={idx}>
                                                <td>{item.name}</td>
                                                <td className="text-right">{item.amount}万</td>
                                                <td className="text-center">
                                                    <span className="status-tag danger">{item.days}天</span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div style={{ marginTop: '12px' }}>
                            <div className="section-label">回款进度</div>
                            <div className="payment-status">
                                <div className="payment-status-item">
                                    <span className="dot green"></span>
                                    已到账 {data.collection.received}万
                                </div>
                                <div className="payment-status-item">
                                    <span className="dot amber"></span>
                                    待到账 {data.collection.pending}万
                                </div>
                                <div className="payment-status-item">
                                    <span className="dot red"></span>
                                    逾期 {data.collection.overdueAmount}万
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 成本费用控制卡片
        const CostCard = ({ data }) => {
            const totalCost = data.laborCost.value + data.serviceCost.value;
            const laborPercent = (data.laborCost.value / totalCost * 100).toFixed(0);
            const servicePercent = (data.serviceCost.value / totalCost * 100).toFixed(0);

            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">📊</span>
                            成本费用控制
                        </div>
                    </div>
                    <div className="card-body">
                        <div style={{ marginBottom: '12px' }}>
                            <div className="section-label">核心成本占比</div>
                            <div className="cost-bar">
                                <div className="cost-bar-segment" style={{ width: `${laborPercent}%`, background: 'linear-gradient(90deg, #0052d9, #3d7dff)' }}>
                                    {laborPercent}%
                                </div>
                                <div className="cost-bar-segment" style={{ width: `${servicePercent}%`, background: 'linear-gradient(90deg, #79a8ff, #2f7bff)' }}>
                                    {servicePercent}%
                                </div>
                            </div>
                            <div className="cost-legend">
                                <span className="cost-legend-item"><span className="cost-dot" style={{ background: '#0052d9' }}></span>人工成本 {data.laborCost.value}万 ({data.laborCost.rate}%)</span>
                                <span className="cost-legend-item"><span className="cost-dot" style={{ background: '#2f7bff' }}></span>辅助成本 {data.serviceCost.value}万 ({data.serviceCost.rate}%)</span>
                            </div>
                        </div>

                        <div style={{ marginBottom: '12px' }}>
                            <div className="section-label">期间费用</div>
                            <div className="stats-grid cols-3">
                                <div className="period-item">
                                    <div className="period-item-value">{data.periodCost.rent}万</div>
                                    <div className="period-item-label">房租水电</div>
                                </div>
                                <div className="period-item">
                                    <div className="period-item-value">{data.periodCost.office}万</div>
                                    <div className="period-item-label">办公费</div>
                                </div>
                                <div className="period-item">
                                    <div className="period-item-value">{data.periodCost.tax}万</div>
                                    <div className="period-item-label">税费</div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div className="section-label">预算执行</div>
                            <div className="progress-bar-wrapper">
                                <div className="progress-label">
                                    <span>本期费用 {data.budget.actual}万</span>
                                    <span>预算 {data.budget.budget}万</span>
                                </div>
                                <div className="progress-bar">
                                    <div className={`progress-fill ${data.budget.status === 'over' ? 'red' : 'green'}`}
                                         style={{ width: `${(data.budget.actual / data.budget.budget * 100)}%` }}>
                                    </div>
                                </div>
                                <div className={`budget-state ${data.budget.status === 'over' ? 'over' : 'save'}`}>
                                    {data.budget.status === 'over' ? '超支' : '节约'} {Math.abs(data.budget.diff)}万元
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 税务管理卡片
        const TaxCard = ({ data }) => {
            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">📑</span>
                            税务管理
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="stats-grid cols-2">
                            <div className="stat-card purple">
                                <div className="stat-label">增值税</div>
                                <div className="stat-value">{data.vat.amount}<span className="stat-unit">万</span></div>
                                <div className="stat-trend">税负率 {data.vat.rate}%</div>
                            </div>
                            <div className="stat-card blue">
                                <div className="stat-label">所得税</div>
                                <div className="stat-value">{data.income.amount}<span className="stat-unit">万</span></div>
                                <div className="stat-trend">税负率 {data.income.rate}%</div>
                            </div>
                        </div>

                        <div style={{ marginTop: '12px' }}>
                            <div className="section-label">开票与收票</div>
                            <div className="tax-progress">
                                <div className="tax-item">
                                    <span className="tax-name">开票金额</span>
                                    <span className="tax-status">
                                        <span className="status-tag info">{data.invoiceIssued}万</span>
                                    </span>
                                </div>
                                <div className="tax-item">
                                    <span className="tax-name">收票金额</span>
                                    <span className="tax-status">
                                        <span className="status-tag info">{data.invoiceReceived}万</span>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div style={{ marginTop: '12px' }}>
                            <div className="section-label">涉税风险点</div>
                            {data.risks.map((risk, idx) => (
                                <div key={idx} className="tax-risk-item">
                                    <span>⚠️</span>
                                    <span>{risk}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 关键风险预警卡片
        const RiskCard = ({ data }) => {
            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">🚨</span>
                            关键风险预警
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="risk-list">
                            {data.map((item, idx) => (
                                <div key={idx} className={`risk-item ${item.level}`}>
                                    <span className="risk-icon">
                                        {item.level === 'high' ? '🔴' : item.level === 'medium' ? '🟡' : '🟢'}
                                    </span>
                                    <div className="risk-content">
                                        <div className="risk-title">{item.title}</div>
                                        <div className="risk-desc">{item.desc}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 主应用组件
        const App = () => {
            const [profitData, setProfitData] = useState(defaultProfitData);
            const [cashFlowData, setCashFlowData] = useState(defaultCashFlowData);
            const [receivableData, setReceivableData] = useState(defaultReceivableData);
            const [costData, setCostData] = useState(defaultCostData);
            const [taxData, setTaxData] = useState(defaultTaxData);
            const [riskData, setRiskData] = useState(defaultRiskData);
            const [fileName, setFileName] = useState('');
            const fileInputRef = useRef(null);
            const updateTime = (() => {
                const now = new Date();
                const pad = (num) => String(num).padStart(2, '0');
                return `${now.getFullYear()}\u5e74${pad(now.getMonth() + 1)}\u6708${pad(now.getDate())}\u65e5 ${pad(now.getHours())}\u65f6${pad(now.getMinutes())}\u5206`;
            })();

            const getSheetName = (workbook, candidates) => candidates.find((name) => workbook.SheetNames.includes(name));
            const toNumber = (value, fallback = 0) => {
                const num = Number(value);
                return Number.isFinite(num) ? num : fallback;
            };
            const toText = (value, fallback = '') => {
                if (value === null || value === undefined) return fallback;
                const text = String(value).trim();
                return text || fallback;
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setFileName(file.name);

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = event.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const profitSheetName = getSheetName(workbook, ['盈利指标']);
                        if (profitSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[profitSheetName]);
                            const map = {};
                            rows.forEach((row) => {
                                map[toText(row['指标'])] = row;
                            });
                            setProfitData({
                                revenue: {
                                    value: toNumber(map['技术支持服务费收入']?.['数值']),
                                    yoyChange: toNumber(map['技术支持服务费收入']?.['同比变化(%)']),
                                    momChange: toNumber(map['技术支持服务费收入']?.['环比变化(%)']),
                                    targetRate: toNumber(map['技术支持服务费收入']?.['目标达成率(%)'])
                                },
                                netProfit: {
                                    value: toNumber(map['净利润']?.['数值']),
                                    rate: toNumber(map['净利润率(%)']?.['数值'])
                                },
                                grossProfit: {
                                    value: toNumber(map['技术服务毛利']?.['数值']),
                                    cost: toNumber(map['直接成本']?.['数值']),
                                    rate: toNumber(map['毛利率(%)']?.['数值'])
                                }
                            });
                        }

                        const cashSheetName = getSheetName(workbook, ['现金流']);
                        if (cashSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[cashSheetName]);
                            const map = {};
                            rows.forEach((row) => {
                                map[toText(row['指标'])] = row;
                            });
                            const months = toNumber(map['未来现金安全垫(月)']?.['数值'], defaultCashFlowData.forecast.months);
                            const nextMonthIn = toNumber(map['下月预计流入']?.['数值']);
                            const nextMonthOut = toNumber(map['下月预计流出']?.['数值']);
                            const hasGapText = toText(map['是否存在缺口']?.['数值'], '否');
                            setCashFlowData({
                                available: toNumber(map['可用资金']?.['数值']),
                                inflow: toNumber(map['本期流入']?.['数值']),
                                outflow: toNumber(map['本期流出']?.['数值']),
                                netFlow: toNumber(map['净现金流']?.['数值']),
                                forecast: {
                                    hasGap: ['是', 'true', 'TRUE', '1'].includes(hasGapText),
                                    months,
                                    nextMonthIn,
                                    nextMonthOut
                                }
                            });
                        }

                        const receivableSheetName = getSheetName(workbook, ['应收款']);
                        if (receivableSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[receivableSheetName]);
                            const summaryMap = {};
                            const customers = [];
                            rows.forEach((row) => {
                                const type = toText(row['类型']);
                                const name = toText(row['名称']);
                                if (type === '客户') {
                                    customers.push({
                                        name,
                                        amount: toNumber(row['金额']),
                                        days: toNumber(row['逾期天数'])
                                    });
                                } else {
                                    summaryMap[name] = row;
                                }
                            });
                            setReceivableData({
                                total: toNumber(summaryMap['应收总额']?.['总额'] ?? summaryMap['应收总额']?.['金额']),
                                overdue: {
                                    amount: toNumber(summaryMap['逾期应收']?.['金额']),
                                    rate: toNumber(summaryMap['逾期应收']?.['比例(%)']),
                                    customers
                                },
                                collection: {
                                    target: toNumber(summaryMap['回款目标']?.['目标']),
                                    actual: toNumber(summaryMap['回款目标']?.['实际']),
                                    rate: toNumber(summaryMap['回款目标']?.['回款率(%)']),
                                    received: toNumber(summaryMap['回款目标']?.['已回款']),
                                    pending: toNumber(summaryMap['回款目标']?.['待回款']),
                                    overdueAmount: toNumber(summaryMap['回款目标']?.['逾期回款额'])
                                }
                            });
                        }

                        const costSheetName = getSheetName(workbook, ['成本费用']);
                        if (costSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[costSheetName]);
                            const map = {};
                            rows.forEach((row) => {
                                map[toText(row['指标'])] = row;
                            });
                            setCostData({
                                laborCost: {
                                    value: toNumber(map['人工成本']?.['数值']),
                                    rate: toNumber(map['人工成本']?.['比例(%)'])
                                },
                                serviceCost: {
                                    value: toNumber(map['服务成本']?.['数值']),
                                    rate: toNumber(map['服务成本']?.['比例(%)'])
                                },
                                periodCost: {
                                    rent: toNumber(map['租金']?.['数值']),
                                    office: toNumber(map['办公']?.['数值']),
                                    tax: toNumber(map['税费']?.['数值'])
                                },
                                budget: {
                                    actual: toNumber(map['期间费用实际']?.['数值']),
                                    budget: toNumber(map['期间费用预算']?.['数值']),
                                    status: toText(map['费用控制状态']?.['状态'], defaultCostData.budget.status),
                                    diff: toNumber(map['预算差额']?.['差额'])
                                }
                            });
                        }

                        const taxSheetName = getSheetName(workbook, ['税务管理']);
                        if (taxSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[taxSheetName]);
                            const map = {};
                            rows.forEach((row) => {
                                map[toText(row['指标'])] = row;
                            });
                            const riskText = toText(map['风险']?.['风险说明']);
                            setTaxData({
                                vat: {
                                    amount: toNumber(map['增值税']?.['数值']),
                                    rate: toNumber(map['增值税']?.['税负率(%)'])
                                },
                                income: {
                                    amount: toNumber(map['企业所得税']?.['数值']),
                                    rate: toNumber(map['企业所得税']?.['税负率(%)'])
                                },
                                invoiceIssued: toNumber(map['开票金额']?.['数值'], defaultTaxData.invoiceIssued),
                                invoiceReceived: toNumber(map['收票金额']?.['数值'], defaultTaxData.invoiceReceived),
                                risks: riskText ? riskText.split('|').map((item) => item.trim()).filter(Boolean) : []
                            });
                        }

                        const riskSheetName = getSheetName(workbook, ['风险预警']);
                        if (riskSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[riskSheetName]);
                            setRiskData(rows.filter((row) => row['标题']).map((row) => ({
                                level: toText(row['等级'], 'medium'),
                                title: toText(row['标题']),
                                desc: toText(row['描述'])
                            })));
                        }

                    } catch (error) {
                        console.error('解析Excel失败:', error);
                        alert('解析Excel文件失败，请检查文件格式');
                    }
                };

                reader.readAsBinaryString(file);
            };

            return (
                <div className="page-container">
                    <div className="top-bar">
                        <div className="detail-meta">
                            <span>所属部门：<strong>财务部</strong></span>
                            <span>更新时间：<strong>{updateTime}</strong></span>
                        </div>
                        <div className="actions">
                            <a
                                className="btn btn-outline"
                                href="../作战室数据导入模板/财务部-数据导入模板V2.xlsx"
                                download
                            >
                                <span>↓</span>
                                下载模板
                            </a>
                            <input
                                type="file"
                                ref={fileInputRef}
                                accept=".xls,.xlsx"
                                onChange={handleFileUpload}
                                style={{ display: 'none' }}
                            />
                            <button
                                className="btn btn-primary"
                                onClick={() => fileInputRef.current.click()}
                            >
                                <span>📤</span>
                                导入周报数据
                            </button>
                        </div>
                    </div>

                    <div className="main-content">
                        {/* 第一行：三列 */}
                        <div className="row-three">
                            <ProfitCard data={profitData} />
                            <CashFlowCard data={cashFlowData} />
                            <ReceivableCard data={receivableData} />
                        </div>

                        {/* 第二行：两列 */}
                        <div className="row-two">
                            <CostCard data={costData} />
                            <TaxCard data={taxData} />
                            <RiskCard data={riskData} />
                        </div>
                    </div>
                </div>
            );
        };

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
