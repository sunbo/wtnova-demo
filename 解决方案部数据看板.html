<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售前商机详情</title>
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --accent-color: #06b6d4;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .page-container {
            padding: 16px;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--primary-color);
        }

        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            text-decoration: none;
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .file-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--success-color);
        }

        /* 主内容区 - 左右布局 */
        .main-layout {
            display: flex;
            gap: 16px;
            align-items: stretch;
        }

        .left-sidebar {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .right-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 让最后一个卡片自动填充剩余高度 */
        .right-content .card:last-child {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .right-content .card:last-child .card-body {
            flex: 1;
            overflow-y: auto;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-title .icon {
            font-size: 16px;
        }

        .card-body {
            padding: 14px 16px;
        }

        /* 目标进展卡片网格 */
        .target-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* 饼图卡片 */
        .pie-card {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 12px;
            text-align: center;
        }

        .pie-card .pie-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .pie-card .pie-chart {
            width: 100px;
            height: 100px;
            margin: 0 auto 8px;
            position: relative;
        }

        .pie-card .pie-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .pie-card .pie-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .pie-card .pie-unit {
            font-size: 10px;
            color: var(--text-muted);
        }

        .pie-card .pie-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            font-size: 10px;
        }

        .pie-card .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .pie-card .legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        /* 资源统计 */
        .resource-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .resource-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
        }

        .resource-item .label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .resource-item .value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .resource-item .value.danger {
            color: var(--danger-color);
        }

        .resource-item .value.success {
            color: var(--success-color);
        }

        /* Tab切换 */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 14px;
        }

        .tab-item {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            margin-bottom: -1px;
        }

        .tab-item:hover {
            color: var(--primary-color);
        }

        .tab-item.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th {
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-primary);
        }

        .data-table tr:hover td {
            background: #fafbfc;
        }

        .data-table .text-center {
            text-align: center;
        }

        .data-table .text-right {
            text-align: right;
        }

        .data-table .text-muted {
            color: var(--text-muted);
        }

        .data-table .amount {
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 月份回款格子 */
        .month-cells {
            display: flex;
            gap: 2px;
        }

        .month-cell {
            width: 24px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            border-radius: 2px;
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .month-cell.has-value {
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 600;
        }

        /* 阶段标签 */
        .stage-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .stage-tag.negotiation {
            background: #fef3c7;
            color: #d97706;
        }

        .stage-tag.signed {
            background: #d1fae5;
            color: #059669;
        }

        .stage-tag.delivery {
            background: #dbeafe;
            color: #2563eb;
        }

        .stage-tag.acceptance {
            background: #f3e8ff;
            color: #7c3aed;
        }

        /* 商机统计 */
        .opportunity-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }

        .opp-stat-item {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            padding: 12px;
            border-radius: var(--radius-md);
            color: white;
            text-align: center;
        }

        .opp-stat-item.cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        }

        .opp-stat-item.emerald {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .opp-stat-item .stat-label {
            font-size: 11px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .opp-stat-item .stat-value {
            font-size: 22px;
            font-weight: 700;
        }

        .opp-stat-item .stat-unit {
            font-size: 11px;
            opacity: 0.9;
        }

        /* 优先级标签 */
        .priority-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .priority-tag.high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-tag.medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-tag.low {
            background: #d1fae5;
            color: #059669;
        }

        /* 赢单率 */
        .win-rate {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .win-rate-bar {
            width: 50px;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .win-rate-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .win-rate-text {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 32px;
        }

        /* 表格滚动容器 */
        .table-scroll {
            max-height: 200px;
            overflow-y: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .table-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* 待办事项 */
        .todo-text {
            font-size: 11px;
            color: var(--text-secondary);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .main-layout {
                flex-direction: column;
            }

            .left-sidebar {
                width: 100%;
            }

            .target-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .target-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .opportunity-stats {
                grid-template-columns: 1fr;
            }
        }
        /* V3 unified compact detail style */

            const size = 100;
            const center = size / 2;
            const radius = 40;
            const innerRadius = 25;

            let currentAngle = -90;
            const paths = [];

            const totalValue = Object.values(data).reduce((a, b) => a + b, 0);

            Object.entries(data).forEach(([key, value], index) => {
                const angle = (value / totalValue) * 360;
                const startAngle = currentAngle;
                const endAngle = currentAngle + angle;

                const startRad = (startAngle * Math.PI) / 180;
                const endRad = (endAngle * Math.PI) / 180;

                const x1 = center + radius * Math.cos(startRad);
                const y1 = center + radius * Math.sin(startRad);
                const x2 = center + radius * Math.cos(endRad);
                const y2 = center + radius * Math.sin(endRad);

                const x3 = center + innerRadius * Math.cos(endRad);
                const y3 = center + innerRadius * Math.sin(endRad);
                const x4 = center + innerRadius * Math.cos(startRad);
                const y4 = center + innerRadius * Math.sin(startRad);

                const largeArc = angle > 180 ? 1 : 0;

                const pathD = `M ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${x4} ${y4} Z`;

                paths.push(
                    <path key={key} d={pathD} fill={colors[index % colors.length]} />
                );

                currentAngle = endAngle;
            });

            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                    {paths}

            );

            useEffect(() => {

            const handleFileUploadV2 = (e) => {
                const file = e.target.files[0];

                setFileName(file.name);

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = event.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });

                        const targetSheetName = getSheetNameV2(workbook, ['目标进展']);
                        if (targetSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[targetSheetName]);
                            if (rows.length > 0) {
                                const row = rows[0];
                                setTargetData({
                                    receivable: {
                                        total: toNumberV2(row['应收总目标']),
                                        custom: toNumberV2(row['应收-定制交付']),
                                        resource: toNumberV2(row['应收-资源整合']),
                                        product: toNumberV2(row['应收-产品ODM'])
                                    },
                                    signed: {
                                        total: toNumberV2(row['签单总目标']),
                                        custom: toNumberV2(row['签单-定制交付']),
                                        resource: toNumberV2(row['签单-资源整合']),
                                        product: toNumberV2(row['签单-产品ODM'])
                                    },
                                    contract: {
                                        total: toNumberV2(row['已签合同总额']),
                                        custom: toNumberV2(row['合同-定制交付']),
                                        resource: toNumberV2(row['合同-资源整合']),
                                        product: toNumberV2(row['合同-产品ODM'])
                                    },
                                    payment: {
                                        total: toNumberV2(row['回款总额']),
                                        custom: toNumberV2(row['回款-定制交付']),
                                        resource: toNumberV2(row['回款-资源整合']),
                                        product: toNumberV2(row['回款-产品ODM'])
                                    },
                                    opportunity: {
                                        total: toNumberV2(row['商机总额']),
                                        existing: toNumberV2(row['已有商机']),
                                        gap: toNumberV2(row['商机缺口'])
                                    },
                                    pending: {
                                        total: toNumberV2(row['待签合同总额']),
                                        custom: toNumberV2(row['待签-定制交付']),
                                        resource: toNumberV2(row['待签-资源整合']),
                                        product: toNumberV2(row['待签-产品ODM'])
                                    }
                                });
                            }
                        }

                        const customSheetName = getSheetNameV2(workbook, ['定制合同']);
                        if (customSheetName) {
                            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[customSheetName]);
                            if (jsonData.length > 0) {
                                setCustomContracts(jsonData.map((row, idx) => ({
                                    id: idx + 1,
                                    project: toTextV2(row['项目名称']),
                                    amount: toNumberV2(row['合同金额']),
                                    stage: toTextV2(row['所处阶段']),
                                    signDate: toTextV2(row['合同时间']),
                                    contractPay: toNumberV2(row['合同款']),
                                    planPay: toNumberV2(row['方案款']),
                                    onlinePay: toNumberV2(row['上线款']),
                                    acceptPay: toNumberV2(row['验收款']),
                                    warrantyPay: toNumberV2(row['质保款']),
                                    todo: toTextV2(row['当前待办'])
                                })));
                            }
                        }

                        const daySheetName = getSheetNameV2(workbook, ['人天合同']);
                        if (daySheetName) {
                            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[daySheetName]);
                            if (jsonData.length > 0) {
                                setDayContracts(jsonData.map((row, idx) => ({
                                    id: idx + 1,
                                    project: toTextV2(row['项目名称']),
                                    amount: toNumberV2(row['合同金额']),
                                    stage: toTextV2(row['所处阶段']),
                                    signDate: toTextV2(row['合同时间']),
                                    months: [
                                        toNumberV2(row['1月']), toNumberV2(row['2月']), toNumberV2(row['3月']),
                                        toNumberV2(row['4月']), toNumberV2(row['5月']), toNumberV2(row['6月']),
                                        toNumberV2(row['7月']), toNumberV2(row['8月']), toNumberV2(row['9月']),
                                        toNumberV2(row['10月']), toNumberV2(row['11月']), toNumberV2(row['12月'])
                                    ],
                                    todo: toTextV2(row['当前待办'])
                                })));
                            }
                        }

                        const opportunitySheetName = getSheetNameV2(workbook, ['商机盘点']);
                        if (opportunitySheetName) {
                            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[opportunitySheetName]);
                            if (jsonData.length > 0) {
                                setOpportunities(jsonData.map((row, idx) => ({
                                    id: idx + 1,
                                    name: toTextV2(row['商机名称']),
                                    customer: toTextV2(row['客户名称']),
                                    owner: toTextV2(row['商务/渠道']),
                                    priority: toTextV2(row['优先级'], '中'),
                                    amount: toNumberV2(row['预估金额']),
                                    winRate: toNumberV2(row['赢单率'], 50),
                                    expectedDate: toTextV2(row['预计签订时间'])
                                })));
                            }
                        }

                        const resourceSheetName = getSheetNameV2(workbook, ['资源情况']);
                        if (resourceSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[resourceSheetName]);
                            if (rows.length > 0) {
                                const row = rows[0];
                                setResourceData({
                                    totalStaff: toNumberV2(row['当前部门人数']),
                                    projectStaff: toNumberV2(row['支撑项目人员']),
                                    gap: toNumberV2(row['人员缺口'])
                                });
                            }
                        }

                        const parsedRiskSummary = parseRiskSummarySheetV2(workbook);
                        if (parsedRiskSummary) {
                            setRiskSummary(parsedRiskSummary);
                        }

                        setUpdateTime(formatNowV2());

                    } catch (error) {
                        console.error('解析Excel失败:', error);
                        alert('解析Excel文件失败，请检查文件格式');
                    }
                };

                reader.readAsBinaryString(file);
            };

            return (
                <div className="page-container">
                    <div className="top-bar">
                        <div className="detail-meta">
                            <span>所属部门：<strong>解决方案部</strong></span>
                            <span>更新时间：<strong>{updateTime}</strong></span>
                        </div>
                        <div className="actions">
                            <button
                                className="btn btn-outline"
                                type="button"
                                onClick={openSolutionEditor}
                            >
                                <span>✎</span>
                                编辑
                            </button>
                            <a
                                className="btn btn-outline"
                                href="../作战室数据导入模板/解决方案部-数据导入模板V2.xlsx"
                                download
                            >
                                <span>↓</span>
                                下载模板
                            </a>
                            <input
                                type="file"
                                ref={fileInputRef}
                                accept=".xls,.xlsx"
                                onChange={handleFileUploadV2}
                                style={{ display: 'none' }}
                            />
                            <button
                                className="btn btn-primary"
                                type="button"
                                onClick={() => fileInputRef.current.click()}
                            >
                                <span>📤</span>
                                导入周报数据
                            </button>
                        </div>
                    </div>

                    <div className="main-layout">
                        <div className="left-sidebar">
                            <TargetProgressCard data={targetData} />
                            <ResourceCard data={resourceData} />
                        </div>
                        <div className="right-content">
                            <LTCCard customContracts={customContracts} dayContracts={dayContracts} />
                            <OpportunityCard opportunities={opportunities} />
                        </div>
                    </div>
                </div>
            );
        };

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
