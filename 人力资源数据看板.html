<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人力资源详情</title>
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --accent-color: #06b6d4;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1 rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3 rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* 页面容器 */
        .page-container {
            padding: 20px;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--primary-color);
        }

        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 主内容区 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 16px;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-title .icon {
            font-size: 18px;
        }

        .card-body {
            padding: 16px 18px;
        }

        /* 统计卡片网格 */
        .stats-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stats-grid.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .stats-grid.cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        /* 统计卡片 */
        .stat-item {
            padding: 14px;
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
        }

        .stat-item.purple {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            color: white;
        }

        .stat-item.cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
        }

        .stat-item.emerald {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .stat-item.amber {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .stat-item.rose {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
        }

        .stat-item.blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .stat-item .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .stat-item .stat-value {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-item .stat-unit {
            font-size: 13px;
            font-weight: 400;
            margin-left: 2px;
            opacity: 0.9;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -30%;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-primary);
        }

        .data-table tr:hover td {
            background: #fafbfc;
        }

        .data-table .text-center {
            text-align: center;
        }

        .data-table .text-muted {
            color: var(--text-muted);
        }

        /* 标签样式 */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .tag-purple {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .tag-cyan {
            background: #cffafe;
            color: #0891b2;
        }

        .tag-emerald {
            background: #d1fae5;
            color: #059669;
        }

        .tag-amber {
            background: #fef3c7;
            color: #d97706;
        }

        .tag-rose {
            background: #ffe4e6;
            color: #e11d48;
        }

        /* 部门列表 */
        .dept-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dept-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            gap: 16px;
        }

        .dept-row:hover {
            background: #f1f5f9;
        }

        .dept-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 100px;
        }

        .dept-stats {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .dept-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .dept-stat .num {
            font-weight: 600;
        }

        .dept-stat .num.success {
            color: var(--success-color);
        }

        .dept-stat .num.danger {
            color: var(--danger-color);
        }

        .dept-stat .lbl {
            color: var(--text-muted);
        }

        /* 汇总栏 */
        .summary-bar {
            display: flex;
            gap: 1px;
            margin-top: 14px;
            background: var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .summary-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: white;
        }

        .summary-item .label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .summary-item .value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .summary-item .value.success {
            color: var(--success-color);
        }

        .summary-item .value.danger {
            color: var(--danger-color);
        }

        /* 事件列表 */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .event-row:hover {
            background: #f1f5f9;
        }

        .event-row .event-name {
            color: var(--text-secondary);
        }

        .event-row .event-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .event-row .event-value.danger {
            color: var(--danger-color);
        }

        /* 表格容器滚动 */
        .table-scroll {
            max-height: 240px;
            overflow-y: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .table-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 文件名显示 */
        .file-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--success-color);
        }

        /* 招聘看板全宽 */
        .card.full-width {
            grid-column: 1 / -1;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .stats-grid.cols-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .card.full-width {
                grid-column: 1;
            }
        }
        /* V3 unified compact detail style */

        .detail-meta strong {

        }

        .bi-grid-2 {
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            gap: 10px;
        }

        .bi-grid-3 {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.9fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .bi-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .balanced-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .balanced-card .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .balanced-content {
            flex: 1;
            min-height: 0;
        }

        .bi-panel-title {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .ring-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            flex: 1;
            min-height: 100%;
        }

        .ring-chart {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            position: relative;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .ring-chart::after {
            content: '';
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            background: #fff;
        }

        .ring-core {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .ring-core .big {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.05;
            color: var(--text-primary);
        }

        .ring-core .small {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .ring-legend {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .legend-item {
            display: grid;
            grid-template-columns: 10px 1fr auto;
            gap: 8px;
            align-items: center;
            font-size: 10px;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .bar-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            height: 100%;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 88px 1fr 42px;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
        }

        .bar-row .name {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .bar-row .num {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: right;
        }

        .bar-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: #e6edf5;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        .bar-fill.green {
            background: linear-gradient(90deg, var(--success-color), #35b98d);
        }

        .bar-fill.amber {
            background: linear-gradient(90deg, var(--warning-color), #f0a341);
        }

        .bar-fill.red {
            background: linear-gradient(90deg, var(--danger-color), #ef6a6a);
        }

        .stacked-track {
            display: flex;
            width: 100%;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: #e6edf5;
        }

        .stacked-track span {
            height: 100%;
        }

        .stacked-current {
            background: linear-gradient(90deg, var(--success-color), #2fb784);
        }

        .stacked-gap {
            background: linear-gradient(90deg, var(--warning-color), #f0a341);
        }

        .dept-bi-list,
        .rank-list {
            display: grid;
            gap: 8px;
        }

        .dept-bi-list {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
        }

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dept-bi-row,
        .rank-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px 9px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
        }

        .dept-bi-head,
        .rank-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .dept-bi-head {
            align-items: flex-start;
        }

        .dept-bi-head strong,
        .rank-head strong {
            font-size: 11px;
            color: var(--text-primary);
        }

        .dept-meta,
        .rank-meta {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .dept-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            background: #eff6ff;
            color: #2563eb;
        }

        .dept-badge.high {
            background: #fef2f2;
            color: var(--danger-color);
        }

        .dept-badge.medium {
            background: #fff7ed;
            color: var(--warning-color);
        }

        .dept-badge.low {
            background: #eff6ff;
            color: #2563eb;
        }

        .rank-summary {
            margin-top: auto;
            padding: 8px 10px;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            background: #fff;
            font-size: 10px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .mini-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .mini-summary-item {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
        }

        .mini-summary-item .label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .mini-summary-item .value {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.05;
            color: var(--primary-color);
        }

        .mini-summary-item .value.green {
            color: var(--success-color);
        }

        .mini-summary-item .value.amber {
            color: var(--warning-color);
        }

        .mini-summary-item .value.red {
            color: var(--danger-color);
        }

        .funnel-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .funnel-row {
            display: grid;
            grid-template-columns: 72px 1fr 44px;
            gap: 8px;
            align-items: center;
        }

        .funnel-row .name {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .funnel-row .num {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: right;
        }

        .funnel-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #e6edf5;
            overflow: hidden;
        }

        .funnel-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #7c3aed, #2563eb);
        }

        .funnel-fill.step-2 {
            background: linear-gradient(90deg, #2563eb, #0891b2);
        }

        .funnel-fill.step-3 {
            background: linear-gradient(90deg, #0891b2, #0f9f6e);
        }

        .funnel-fill.step-4 {
            background: linear-gradient(90deg, #0f9f6e, #36b58a);
        }

        .funnel-fill.step-5 {
            background: linear-gradient(90deg, #d97706, #f0a341);
        }

        .funnel-fill.step-6 {
            background: linear-gradient(90deg, #dc2626, #ef6a6a);
        }

        @media (max-width: 1200px) {
            .bi-grid-2,
            .bi-grid-3,
            .mini-summary,
            .dept-bi-list {
                grid-template-columns: 1fr;
            }
        }
        /* V3 detail hover/background sync */
        :root {
            --bg-color: #fafafa;
        }

        body {
            background: #fafafa !important;
        }

        .btn:hover,
        .btn-primary:hover,
        .btn-outline:hover,
        .card:hover,
        .stat-item:hover,
        .summary-item:hover,
        .metric-box:hover,
        .viz-panel:hover,
        .list-item:hover,
        .risk-item:hover,
        .opportunity-item:hover,
        .vacancy-item:hover,
        .project-row:hover,
        .payment-stat-item:hover,
        .opp-stat-item:hover,
        .bi-panel:hover,
        .dept-bi-row:hover,
        .rank-row:hover,
        .mini-summary-item:hover,
        .file-indicator:hover {
            background: #f5f5f5 !important;
            box-shadow: none !important;
        }

        .btn-primary:hover,
        .btn-outline:hover {
            color: var(--text-primary) !important;
            border-color: var(--border-color) !important;
            transform: none !important;
        }

        .data-table tr:hover td,
        tr:hover td {
            background: #f5f5f5 !important;
        }
        :root {
            --primary-color: #0052d9;
            --primary-light: #3d7dff;
            --primary-dark: #003a99;
            --accent-color: #79a8ff;
            --primary-soft: #e8f0ff;
            --primary-soft-strong: #cfe0ff;
            --bg-color: #f5f8fe;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #526077;
            --text-muted: #8c97aa;
            --border-color: #dde5ef;
            --success-color: #2f7bff;
            --warning-color: #d97706;
            --danger-color: #dc2626;
        }
        .btn-primary{background:linear-gradient(135deg,var(--primary-color) 0%,var(--primary-dark) 100%) !important;border-color:var(--primary-color)!important;box-shadow:none!important}
        .btn-primary:hover{background:linear-gradient(135deg,var(--primary-color) 0%,var(--primary-dark) 100%) !important}
        .stat-item.purple,.stat-item.cyan,.stat-item.emerald,.stat-item.blue{background:linear-gradient(135deg,var(--primary-color) 0%,var(--primary-dark) 100%) !important}
        .tag-purple,.tag-cyan,.tag-emerald{background:var(--primary-soft)!important;color:var(--primary-color)!important}
        .bar-fill.green,.bar-fill.amber{background:linear-gradient(90deg,var(--primary-color),var(--primary-light)) !important}
        .stat-item .stat-label,
        .stat-item .stat-value,
        .stat-item .stat-unit,
        .summary-item .label,
        .summary-item .value,
        .summary-item .value.danger,
        .summary-item .value.success{
            color:var(--text-primary) !important;
            opacity:1 !important;
        }
        .stat-item.purple .stat-value,
        .stat-item.cyan .stat-value,
        .stat-item.emerald .stat-value,
        .stat-item.amber .stat-value,
        .stat-item.rose .stat-value,
        .stat-item.blue .stat-value,
        .summary-item .value,
        .summary-item .value.success,
        .summary-item .value.danger,
        .mini-summary-item .value,
        .mini-summary-item .value.green,
        .mini-summary-item .value.amber,
        .mini-summary-item .value.red{
            color:var(--text-primary) !important;
            opacity:1 !important;
        }
        .stacked-current{background:linear-gradient(90deg,var(--primary-color),var(--primary-light)) !important}
        .funnel-fill,.funnel-fill.step-2,.funnel-fill.step-3,.funnel-fill.step-4,.funnel-fill.step-5,.funnel-fill.step-6{background:linear-gradient(90deg,var(--primary-color),var(--primary-light)) !important}
        :is([class*="card"], [class*="panel"], [class*="item"], [class*="box"], [class*="road"], [class*="scroll"], .field, .repeat-row, .subblock, .sticky, .modal) {
            border-radius: 0 !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- SheetJS -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./dashboard-sync.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 默认招聘数据
        const defaultRecruitmentData = [
            { id: 1, position: '架构师', department: '产品研发部', level: 'P9', urgency: '中', demand: 1, resume: 1, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 2, position: '前端开发', department: '产品研发部', level: 'P5', urgency: '高', demand: 1, resume: 1, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 3, position: '测试助理', department: '产品研发部', level: 'P0-P3', urgency: '中', demand: 1, resume: 0, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 4, position: '开发助理', department: '产品研发部', level: 'P0-P3', urgency: '高', demand: 1, resume: 0, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 5, position: '售前顾问', department: '解决方案部', level: 'P8', urgency: '非常高', demand: 1, resume: 0, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 6, position: '销售助理', department: '综合管理部', level: 'P5', urgency: '非常高', demand: 2, resume: 0, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 7, position: '项目经理', department: '实施交付部', level: 'P7-P8', urgency: '中', demand: 1, resume: 0, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
            { id: 8, position: 'APS/MES顾问', department: '实施交付部', level: 'P6-P8', urgency: '高', demand: 2, resume: 0, firstInterview: 0, secondInterview: 0, offer: 0, onboarded: 0 },
        ];

        // 默认员工关系数据
        const defaultEmployeeRelationsData = {
            events: [
                { type: '在编总人数', count: 93 },
                { type: '入职人数', count: 0 },
                { type: '离职人数', count: 0 },
                { type: '转正人数', count: 0 },
                { type: '劳动合同续签', count: 0 },
                { type: '试用期人数', count: 0 }
            ]
        };

        // 默认部门数据
        const defaultDepartmentData = [
            { department: '总经办', totalPositions: 5, currentStaff: 4, vacant: 1 },
            { department: '解决方案部', totalPositions: 15, currentStaff: 12, vacant: 3 },
            { department: '产品研发部', totalPositions: 30, currentStaff: 25, vacant: 5 },
            { department: '实施交付部', totalPositions: 20, currentStaff: 18, vacant: 2 },
            { department: '综合管理部', totalPositions: 8, currentStaff: 7, vacant: 1 },
            { department: '财务部', totalPositions: 6, currentStaff: 5, vacant: 1 },
        ];

        const defaultRiskSummary = [
            { category: '人力', summary: '在编稳定，但关键岗位招聘推进偏慢', level: '严重' }
        ];

        const formatNow = () => {
            const now = new Date();
            const pad = (num) => String(num).padStart(2, '0');
            return `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日 ${pad(now.getHours())}时${pad(now.getMinutes())}分`;
        };

        const parseRiskSummarySheet = (workbook) => {
            const riskSheet = workbook.Sheets['风险概述'];
            if (!riskSheet) return null;
            const rows = XLSX.utils.sheet_to_json(riskSheet, { defval: '' });
            const items = rows
                .filter((row) => String(row['风险类别'] || '').trim() || String(row['风险概述'] || '').trim())
                .map((row) => ({
                    category: String(row['风险类别'] || '').trim(),
                    summary: String(row['风险概述'] || '').trim(),
                    level: String(row['风险等级'] || '一般').trim()
                }))
                .filter((item) => item.category || item.summary);
            return items.length > 0 ? items : null;
        };

        const buildHrIndexSource = ({ recruitmentData, employeeRelationsData, departmentData, riskSummary, updateTime, fileName }) => ({
            key: 'hr',
            updateTime,
            fileName,
            recruitmentData,
            employeeRelationsData,
            departmentData,
            riskSummary
        });

        // 解析Excel数据
        const parseExcelData = (data) => {
            const result = {
                recruitment: [],
                employeeRelations: { events: [] },
                department: []
            };

            // 解析招聘看板
            if (data['招聘看板']) {
                const sheet = data['招聘看板'];
                result.recruitment = sheet.slice(1).map((row, idx) => ({
                    id: idx + 1,
                    position: row[1] || '',
                    department: row[7] || '',
                    level: row[3] || '',
                    urgency: row[4] || '',
                    demand: row[2] || 0,
                    resume: row[8] || 0,
                    firstInterview: row[10] || 0,
                    secondInterview: row[13] || 0,
                    offer: row[16] || 0,
                    onboarded: row[17] || 0,
                }));
            }

            // 解析员工关系看板
            if (data['员工关系看板']) {
                const sheet = data['员工关系看板'];
                result.employeeRelations.events = sheet.slice(1).map(row => ({
                    type: row[0] || '',
                    count: row[1] || 0
                }));
            }

            // 解析部门人力概览
            if (data['部门人力概览']) {
                const sheet = data['部门人力概览'];
                let currentDept = null;
                const deptMap = {};

                sheet.slice(1).forEach(row => {
                    if (row[0] && row[0] !== '企业总人数') {
                        currentDept = row[0];
                        deptMap[currentDept] = { department: currentDept, currentStaff: 0, vacant: 0 };
                    }
                    if (row[1] === '在编' && currentDept) {
                        deptMap[currentDept].currentStaff = row[2] || 0;
                    }
                    if (row[1] === '缺编' && currentDept) {
                        deptMap[currentDept].vacant = row[2] || 0;
                    }
                });

                result.department = Object.values(deptMap).map(d => ({
                    ...d,
                    totalPositions: d.currentStaff + d.vacant
                }));
            }

            return result;
        };

        // 紧急程度标签
        const UrgencyTag = ({ urgency }) => {
            let className = 'tag-amber';
            if (urgency === '非常高') className = 'tag-rose';
            else if (urgency === '高') className = 'tag-amber';
            else if (urgency === '低' || urgency === '底') className = 'tag-emerald';

            return <span className={`tag ${className}`}>{urgency}</span>;
        };

        // 员工关系看板组件
        const EmployeeRelationsCard = ({ data, departmentVacant }) => {
            const { events } = data;
            const totalCount = events[0] ? events[0].count : 0;

            return (
                <div className="card">
                    <div className="card-header">
                        <div>
                            <div className="card-title">
                                <span className="icon">👥</span>
                                员工关系
                            </div>
                            <div className="card-subtitle">展示在编、入转离及合同续签等情况</div>
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="stats-grid cols-2">
                            <div className="stat-item cyan">
                                <div className="stat-label">在编总人数</div>
                                <div className="stat-value">{totalCount}<span className="stat-unit">人</span></div>
                            </div>
                            <div className="stat-item rose">
                                <div className="stat-label">缺编总人数</div>
                                <div className="stat-value">{departmentVacant}<span className="stat-unit">人</span></div>
                            </div>
                        </div>

                        <div className="event-list">
                            {events.map((event, idx) => (
                                <div key={idx} className="event-row">
                                    <span className="event-name">{event.type}</span>
                                    <span className={`event-value ${event.type.includes('离职') ? 'danger' : ''}`}>
                                        {event.count} {event.type.includes('人数') ? '人' : '件'}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 部门人力概览组件
        const DepartmentCard = ({ data }) => {
            const totalStaff = data.reduce((sum, item) => sum + item.currentStaff, 0);
            const totalVacant = data.reduce((sum, item) => sum + item.vacant, 0);
            const totalPositions = data.reduce((sum, item) => sum + item.totalPositions, 0);

            return (
                <div className="card">
                    <div className="card-header">
                        <div>
                            <div className="card-title">
                                <span className="icon">🏢</span>
                                部门人力概览
                            </div>
                            <div className="card-subtitle">展示编制、在岗与部门缺口分布</div>
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="dept-list">
                            {data.map((dept, idx) => (
                                <div key={idx} className="dept-row">
                                    <div className="dept-name">{dept.department}</div>
                                    <div className="dept-stats">
                                        <div className="dept-stat">
                                            <span className="num">{dept.totalPositions}</span>
                                            <span className="lbl">编制</span>
                                        </div>
                                        <div className="dept-stat">
                                            <span className="num success">{dept.currentStaff}</span>
                                            <span className="lbl">在编</span>
                                        </div>
                                        <div className="dept-stat">
                                            <span className="num danger">{dept.vacant}</span>
                                            <span className="lbl">缺编</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="summary-bar">
                            <div className="summary-item">
                                <div className="label">总编制</div>
                                <div className="value">{totalPositions}</div>
                            </div>
                            <div className="summary-item">
                                <div className="label">在编</div>
                                <div className="value success">{totalStaff}</div>
                            </div>
                            <div className="summary-item">
                                <div className="label">缺编</div>
                                <div className="value danger">{totalVacant}</div>
                            </div>
                            <div className="summary-item">
                                <div className="label">到岗率</div>
                                <div className="value">{totalPositions > 0 ? Math.round((totalStaff / totalPositions) * 100) : 0}%</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 招聘看板组件
        const RecruitmentCard = ({ data }) => {
            const totalPositions = data.length;
            const totalDemand = data.reduce((sum, item) => sum + (item.demand || 0), 0);
            const totalOffer = data.reduce((sum, item) => sum + (item.offer || 0), 0);
            const totalOnboarded = data.reduce((sum, item) => sum + (item.onboarded || 0), 0);

            return (
                <div className="card full-width">
                    <div className="card-header">
                        <div>
                            <div className="card-title">
                                <span className="icon">📊</span>
                                招聘看板
                            </div>
                            <div className="card-subtitle">展示招聘漏斗与岗位推进进度</div>
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="stats-grid cols-4">
                            <div className="stat-item purple">
                                <div className="stat-label">招聘职位</div>
                                <div className="stat-value">{totalPositions}<span className="stat-unit">个</span></div>
                            </div>
                            <div className="stat-item cyan">
                                <div className="stat-label">招聘需求</div>
                                <div className="stat-value">{totalDemand}<span className="stat-unit">人</span></div>
                            </div>
                            <div className="stat-item emerald">
                                <div className="stat-label">已发Offer</div>
                                <div className="stat-value">{totalOffer}<span className="stat-unit">份</span></div>
                            </div>
                            <div className="stat-item blue">
                                <div className="stat-label">已入职</div>
                                <div className="stat-value">{totalOnboarded}<span className="stat-unit">人</span></div>
                            </div>
                        </div>

                        <div className="table-scroll">
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>招聘岗位</th>
                                        <th>所属项目</th>
                                        <th className="text-center">职级</th>
                                        <th className="text-center">紧急程度</th>
                                        <th className="text-center">需求</th>
                                        <th className="text-center">简历</th>
                                        <th className="text-center">初面</th>
                                        <th className="text-center">复试</th>
                                        <th className="text-center">Offer</th>
                                        <th className="text-center">入职</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((row) => (
                                        <tr key={row.id}>
                                            <td>{row.position}</td>
                                            <td>{row.department}</td>
                                            <td className="text-center">{row.level}</td>
                                            <td className="text-center">
                                                {row.urgency ? <UrgencyTag urgency={row.urgency} /> : <span className="text-muted">-</span>}
                                            </td>
                                            <td className="text-center">{row.demand}</td>
                                            <td className="text-center">{row.resume}</td>
                                            <td className="text-center">{row.firstInterview}</td>
                                            <td className="text-center">{row.secondInterview}</td>
                                            <td className="text-center">{row.offer}</td>
                                            <td className="text-center">{row.onboarded}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // 主应用组件
        const HR_CORE_DEPARTMENTS = ['总经办', '解决方案部', '产品研发部', '实施交付部', '综合管理部', '财务部'];

        const EmployeeRelationsCardV2 = ({ data, departmentVacant }) => {
            const { events } = data;
            const totalCount = events[0] ? events[0].count : 0;
            const totalBase = Math.max(totalCount + departmentVacant, 1);
            const filledRate = Math.round((totalCount / totalBase) * 100);
            const eventMax = Math.max(...events.map((event) => event.count || 0), 1);
            const ringStyle = {
                background: `conic-gradient(var(--primary-color) 0 ${filledRate}%, #e6edf5 ${filledRate}% 100%)`
            };

            return (
                <div className="card balanced-card">
                    <div className="card-header">
                        <div>
                            <div className="card-title">员工关系</div>
                            <div className="card-subtitle">展示在编、入转离及合同续签等情况</div>
                        </div>
                    </div>
                    <div className="card-body balanced-body">
                        <div className="bi-grid-2 balanced-content">
                            <div className="bi-panel">
                                <div className="bi-panel-title">编制状态</div>
                                <div className="ring-layout">
                                    <div className="ring-chart" style={ringStyle}>
                                        <div className="ring-core">
                                            <div className="big">{filledRate}%</div>
                                            <div className="small">到岗率</div>
                                        </div>
                                    </div>
                                    <div className="ring-legend">
                                        <div className="legend-item">
                                            <span className="legend-dot" style={{ background: 'var(--primary-color)' }}></span>
                                            <span>在编总人数</span>
                                            <strong>{totalCount}人</strong>
                                        </div>
                                        <div className="legend-item">
                                            <span className="legend-dot" style={{ background: 'var(--danger-color)' }}></span>
                                            <span>缺编人数</span>
                                            <strong>{departmentVacant}人</strong>
                                        </div>
                                        <div className="legend-item">
                                            <span className="legend-dot" style={{ background: '#cbd5e1' }}></span>
                                            <span>编制总量</span>
                                            <strong>{totalBase}人</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="bi-panel">
                                <div className="bi-panel-title">人员事件分布</div>
                                <div className="bar-list">
                                    {events.map((event, idx) => {
                                        const fillClass = idx === 1
                                            ? 'green'
                                            : idx === 2
                                                ? 'red'
                                                : idx === events.length - 1
                                                    ? 'amber'
                                                    : '';
                                        const width = event.count > 0 ? Math.max((event.count / eventMax) * 100, 10) : 0;
                                        return (
                                            <div key={idx} className="bar-row">
                                                <span className="name">{event.type}</span>
                                                <div className="bar-track">
                                                    <div
                                                        className={`bar-fill ${fillClass}`.trim()}
                                                        style={{ width: `${width}%` }}
                                                    ></div>
                                                </div>
                                                <span className="num">{event.count}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const DepartmentCardV2 = ({ data }) => {
            const filteredData = HR_CORE_DEPARTMENTS
                .map((department) => data.find((item) => item.department === department))
                .filter(Boolean);
            const totalStaff = filteredData.reduce((sum, item) => sum + item.currentStaff, 0);
            const totalVacant = filteredData.reduce((sum, item) => sum + item.vacant, 0);
            const totalPositions = filteredData.reduce((sum, item) => sum + item.totalPositions, 0);
            const displayData = [...filteredData].sort((a, b) => b.vacant - a.vacant || b.totalPositions - a.totalPositions);
            const fillRate = totalPositions > 0 ? Math.round((totalStaff / totalPositions) * 100) : 0;

            return (
                <div className="card balanced-card">
                    <div className="card-header">
                        <div>
                            <div className="card-title">部门人力概览</div>
                            <div className="card-subtitle">展示编制、在岗与部门缺口分布</div>
                        </div>
                    </div>
                    <div className="card-body balanced-body">
                        <div className="mini-summary">
                            <div className="mini-summary-item">
                                <div className="label">总编制</div>
                                <div className="value">{totalPositions}</div>
                            </div>
                            <div className="mini-summary-item">
                                <div className="label">在编</div>
                                <div className="value green">{totalStaff}</div>
                            </div>
                            <div className="mini-summary-item">
                                <div className="label">缺编</div>
                                <div className="value red">{totalVacant}</div>
                            </div>
                            <div className="mini-summary-item">
                                <div className="label">到岗率</div>
                                <div className="value amber">{fillRate}%</div>
                            </div>
                        </div>
                        <div className="balanced-content">
                            <div className="bi-panel">
                                <div className="bi-panel-title">部门编制与缺编优先级</div>
                                <div className="dept-bi-list">
                                    {displayData.map((dept, idx) => {
                                        const currentWidth = dept.totalPositions > 0 ? (dept.currentStaff / dept.totalPositions) * 100 : 0;
                                        const gapWidth = dept.totalPositions > 0 ? (dept.vacant / dept.totalPositions) * 100 : 0;
                                        const vacancyClass = dept.vacant >= 3 ? 'high' : dept.vacant >= 1 ? 'medium' : 'low';
                                        return (
                                            <div key={idx} className="dept-bi-row">
                                                <div className="dept-bi-head">
                                                    <strong>{dept.department}</strong>
                                                    <span className={`dept-badge ${vacancyClass}`}>缺编 {dept.vacant}人</span>
                                                </div>
                                                <div className="stacked-track">
                                                    <span className="stacked-current" style={{ width: `${currentWidth}%` }}></span>
                                                    <span className="stacked-gap" style={{ width: `${gapWidth}%` }}></span>
                                                </div>
                                                <div className="dept-meta">编制 {dept.totalPositions}人 / 在编 {dept.currentStaff}人 / 到岗率 {dept.totalPositions > 0 ? Math.round((dept.currentStaff / dept.totalPositions) * 100) : 0}%</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const RecruitmentCardV2 = ({ data }) => {
            const totalPositions = data.length;
            const totalDemand = data.reduce((sum, item) => sum + (item.demand || 0), 0);
            const totalResume = data.reduce((sum, item) => sum + (item.resume || 0), 0);
            const totalFirst = data.reduce((sum, item) => sum + (item.firstInterview || 0), 0);
            const totalSecond = data.reduce((sum, item) => sum + (item.secondInterview || 0), 0);
            const totalOffer = data.reduce((sum, item) => sum + (item.offer || 0), 0);
            const totalOnboarded = data.reduce((sum, item) => sum + (item.onboarded || 0), 0);

            const funnelData = [
                { label: '需求', value: totalDemand, className: '' },
                { label: '简历', value: totalResume, className: 'step-2' },
                { label: '初面', value: totalFirst, className: 'step-3' },
                { label: '复试', value: totalSecond, className: 'step-4' },
                { label: 'Offer', value: totalOffer, className: 'step-5' },
                { label: '入职', value: totalOnboarded, className: 'step-6' }
            ];
            const funnelMax = Math.max(...funnelData.map((item) => item.value || 0), 1);

            const urgencyMap = data.reduce((acc, item) => {
                const key = item.urgency || '未标注';
                acc[key] = (acc[key] || 0) + (item.demand || 0);
                return acc;
            }, {});
            const urgencyData = Object.entries(urgencyMap)
                .map(([label, value]) => ({ label, value }))
                .sort((a, b) => b.value - a.value);
            const urgencyMax = Math.max(...urgencyData.map((item) => item.value || 0), 1);

            const departmentMap = data.reduce((acc, item) => {
                const key = item.department || '未分配';
                if (!acc[key]) {
                    acc[key] = { department: key, demand: 0, onboarded: 0 };
                }
                acc[key].demand += item.demand || 0;
                acc[key].onboarded += item.onboarded || 0;
                return acc;
            }, {});
            const departmentData = Object.values(departmentMap).sort((a, b) => b.demand - a.demand);
            const departmentMax = Math.max(...departmentData.map((item) => item.demand || 0), 1);

            return (
                <div className="card full-width">
                    <div className="card-header">
                        <div>
                            <div className="card-title">招聘看板</div>
                            <div className="card-subtitle">展示招聘漏斗与岗位推进进度</div>
                        </div>
                    </div>
                    <div className="card-body">
                        <div className="mini-summary">
                            <div className="mini-summary-item">
                                <div className="label">招聘岗位</div>
                                <div className="value">{totalPositions}</div>
                            </div>
                            <div className="mini-summary-item">
                                <div className="label">招聘需求</div>
                                <div className="value">{totalDemand}</div>
                            </div>
                            <div className="mini-summary-item">
                                <div className="label">简历量</div>
                                <div className="value green">{totalResume}</div>
                            </div>
                            <div className="mini-summary-item">
                                <div className="label">已入职</div>
                                <div className="value amber">{totalOnboarded}</div>
                            </div>
                        </div>
                        <div className="bi-grid-3">
                            <div className="bi-panel">
                                <div className="bi-panel-title">招聘转化漏斗</div>
                                <div className="funnel-list">
                                    {funnelData.map((item, idx) => (
                                        <div key={idx} className="funnel-row">
                                            <span className="name">{item.label}</span>
                                            <div className="funnel-track">
                                                <div
                                                    className={`funnel-fill ${item.className}`.trim()}
                                                    style={{ width: `${item.value > 0 ? Math.max((item.value / funnelMax) * 100, 10) : 0}%` }}
                                                ></div>
                                            </div>
                                            <span className="num">{item.value}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bi-panel">
                                <div className="bi-panel-title">紧急程度分布</div>
                                <div className="bar-list">
                                    {urgencyData.map((item, idx) => (
                                        <div key={idx} className="bar-row">
                                            <span className="name">{item.label}</span>
                                            <div className="bar-track">
                                                <div
                                                    className={`bar-fill ${idx === 0 ? 'red' : idx === 1 ? 'amber' : 'green'}`.trim()}
                                                    style={{ width: `${Math.max((item.value / urgencyMax) * 100, 10)}%` }}
                                                ></div>
                                            </div>
                                            <span className="num">{item.value}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bi-panel">
                                <div className="bi-panel-title">部门需求分布</div>
                                <div className="bar-list">
                                    {departmentData.map((item, idx) => (
                                        <div key={idx} className="bar-row">
                                            <span className="name">{item.department}</span>
                                            <div className="bar-track">
                                                <div
                                                    className={`bar-fill ${idx === 0 ? 'amber' : ''}`.trim()}
                                                    style={{ width: `${Math.max((item.demand / departmentMax) * 100, 10)}%` }}
                                                ></div>
                                            </div>
                                            <span className="num">{item.demand}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="table-scroll">
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>招聘岗位</th>
                                        <th>所属项目</th>
                                        <th className="text-center">职级</th>
                                        <th className="text-center">紧急程度</th>
                                        <th className="text-center">需求</th>
                                        <th className="text-center">简历</th>
                                        <th className="text-center">初面</th>
                                        <th className="text-center">复试</th>
                                        <th className="text-center">Offer</th>
                                        <th className="text-center">入职</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((row) => (
                                        <tr key={row.id}>
                                            <td>{row.position}</td>
                                            <td>{row.department}</td>
                                            <td className="text-center">{row.level}</td>
                                            <td className="text-center">
                                                {row.urgency ? <UrgencyTag urgency={row.urgency} /> : <span className="text-muted">-</span>}
                                            </td>
                                            <td className="text-center">{row.demand}</td>
                                            <td className="text-center">{row.resume}</td>
                                            <td className="text-center">{row.firstInterview}</td>
                                            <td className="text-center">{row.secondInterview}</td>
                                            <td className="text-center">{row.offer}</td>
                                            <td className="text-center">{row.onboarded}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const persistedState = window.DashboardSync?.getStoredPageState('hr', {
                recruitmentData: defaultRecruitmentData,
                employeeRelationsData: defaultEmployeeRelationsData,
                departmentData: defaultDepartmentData,
                riskSummary: defaultRiskSummary,
                updateTime: formatNow(),
                fileName: ''
            }) || {};

            const [recruitmentData, setRecruitmentData] = useState(persistedState.recruitmentData || defaultRecruitmentData);
            const [employeeRelationsData, setEmployeeRelationsData] = useState(persistedState.employeeRelationsData || defaultEmployeeRelationsData);
            const [departmentData, setDepartmentData] = useState(persistedState.departmentData || defaultDepartmentData);
            const [riskSummary, setRiskSummary] = useState(persistedState.riskSummary || defaultRiskSummary);
            const [fileName, setFileName] = useState(persistedState.fileName || '');
            const [updateTime, setUpdateTime] = useState(persistedState.updateTime || formatNow());
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (!window.DashboardSync) return;
                const pageState = { recruitmentData, employeeRelationsData, departmentData, riskSummary, updateTime, fileName };
                window.DashboardSync.persistDepartment('hr', pageState, buildHrIndexSource(pageState));
            }, [recruitmentData, employeeRelationsData, departmentData, riskSummary, updateTime, fileName]);

            useEffect(() => {
                const handleStorageSync = (event) => {
                    if (!event.key || event.key !== 'zuozhanshi_v6_dashboard:page:hr' || !window.DashboardSync) return;
                    const latestState = window.DashboardSync.getStoredPageState('hr', null);
                    if (!latestState) return;
                    setRecruitmentData(latestState.recruitmentData || defaultRecruitmentData);
                    setEmployeeRelationsData(latestState.employeeRelationsData || defaultEmployeeRelationsData);
                    setDepartmentData(latestState.departmentData || defaultDepartmentData);
                    setRiskSummary(latestState.riskSummary || defaultRiskSummary);
                    setFileName(latestState.fileName || '');
                    setUpdateTime(latestState.updateTime || formatNow());
                };

                window.addEventListener('storage', handleStorageSync);
                return () => {
                    window.removeEventListener('storage', handleStorageSync);
                };
            }, []);

            const openHrEditor = () => {
                window.open('./人力资源详情-编辑.html', '_blank', 'noopener,noreferrer');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setFileName(file.name);

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = event.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });

                        const sheetData = {};
                        workbook.SheetNames.forEach(sheetName => {
                            const sheet = workbook.Sheets[sheetName];
                            sheetData[sheetName] = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        });

                        const parsed = parseExcelData(sheetData);

                        if (parsed.recruitment.length > 0) {
                            setRecruitmentData(parsed.recruitment);
                        }
                        if (parsed.employeeRelations.events.length > 0) {
                            setEmployeeRelationsData(parsed.employeeRelations);
                        }
                        if (parsed.department.length > 0) {
                            setDepartmentData(parsed.department);
                        }

                        const parsedRiskSummary = parseRiskSummarySheet(workbook);
                        if (parsedRiskSummary) {
                            setRiskSummary(parsedRiskSummary);
                        }

                        setUpdateTime(formatNow());
                    } catch (error) {
                        console.error('解析Excel失败:', error);
                        alert('解析Excel文件失败，请检查文件格式');
                    }
                };

                reader.readAsBinaryString(file);
            };

            const departmentVacant = departmentData.reduce((sum, item) => sum + item.vacant, 0);

            return (
                <div className="page-container">
                    <div className="top-bar">
                        <div className="detail-meta">
                            <span>所属部门：<strong>人力资源部</strong></span>
                            <span>更新时间：<strong>{updateTime}</strong></span>
                        </div>
                        <div className="actions">
                            <button
                                className="btn btn-outline"
                                type="button"
                                onClick={openHrEditor}
                            >
                                <span>✎</span>
                                编辑
                            </button>
                            <a
                                className="btn btn-outline"
                                href="../作战室数据导入模板/人力资源部-数据导入模板V2.xlsx"
                                download
                            >
                                <span>↓</span>
                                下载模板
                            </a>
                            <input
                                type="file"
                                ref={fileInputRef}
                                accept=".xls,.xlsx"
                                onChange={handleFileUpload}
                                style={{ display: 'none' }}
                            />
                            <button
                                className="btn btn-primary"
                                type="button"
                                onClick={() => fileInputRef.current.click()}
                            >
                                <span>📤</span>
                                导入周报数据
                            </button>
                        </div>
                    </div>

                    <div className="dashboard-grid">
                        <EmployeeRelationsCardV2 data={employeeRelationsData} departmentVacant={departmentVacant} />
                        <DepartmentCardV2 data={departmentData} />
                        <RecruitmentCardV2 data={recruitmentData} />
                    </div>
                </div>
            );
        };

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
