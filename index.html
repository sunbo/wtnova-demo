<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经营数据看板</title>
  <style>
    :root{
      --bg:#fafafa;
      --panel:#ffffff;
      --panel-soft:#f8fafc;
      --line:#dde5ef;
      --line-strong:#cfd9e5;
      --text:#0f172a;
      --sub:#526077;
      --muted:#8c97aa;
      --blue:#0052d9;
      --cyan:#2f7bff;
      --green:#79a8ff;
      --amber:#d97706;
      --red:#dc2626;
      --purple:#003a99;
      --shadow:0 16px 40px -28px rgba(15,23,42,.28);
      --radius:16px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.42;
      font-size:12px;
    }

    .page{max-width:1660px;margin:0 auto;padding:12px 12px 24px}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
      min-height:20px;padding:0 0 5px;margin-bottom:6px;border-bottom:1px solid var(--line)
    }
    .crumb,.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .crumb{font-size:11px;color:var(--sub);line-height:1.1}
    .crumb .current{font-weight:800;color:var(--text)}

    .top-metric{
      background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;
      min-height:72px;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:background-color .18s ease,border-color .18s ease
    }
    .top-metric .label,.metric-box .label,.viz-title,.subline,.list-meta,.modal-sub{font-size:10px;color:var(--sub)}
    .top-metric .value{margin-top:3px;font-size:18px;font-weight:800;line-height:1.05}
    .top-metric .desc{margin-top:4px;font-size:10px;color:var(--muted);line-height:1.4}
    .blue{color:var(--blue)} .green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)} .purple{color:var(--purple)}

    .dept-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px
    }
    .dept-card{
      background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;
      box-shadow:0 1px 2px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:8px;min-height:0;transition:background-color .18s ease,border-color .18s ease
    }

    .dept-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .dept-title{display:flex;flex-direction:column;gap:0}
    .dept-title h3{font-size:13px;font-weight:800}
    .dept-actions{display:flex;align-items:center;gap:6px}
    .status{
      display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;
      font-size:10px;font-weight:700;white-space:nowrap;background:#f3f6fa
    }
    .status.good{color:var(--green)}
    .status.warn{color:var(--amber)}
    .status.risk{color:var(--red)}
    .more-btn{
      display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
      border:1px solid rgba(37,99,235,.18);border-radius:999px;background:rgba(37,99,235,.05);color:var(--blue);cursor:pointer;
      transition:all .18s ease
    }
    .more-btn:hover{border-color:var(--line-strong);color:var(--blue);background:#f5f5f5}
    .more-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .metric-grid-4,.metric-grid-3,.metric-grid-2{
      display:grid;gap:6px
    }
    .metric-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .metric-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .metric-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .metric-box{
      background:var(--panel-soft);border:1px solid var(--line);border-radius:11px;padding:7px;transition:background-color .18s ease,border-color .18s ease
    }
    .metric-box .value{font-size:15px;font-weight:800;line-height:1.05;margin-top:3px}
    .metric-box .desc{margin-top:3px;font-size:10px;color:var(--muted);line-height:1.35}

    .dept-card.overview .metric-grid-4{
      flex:1;align-content:stretch;grid-auto-rows:minmax(86px,1fr)
    }
    .dept-card.overview .top-metric{
      min-height:0;height:100%;display:flex;flex-direction:column;justify-content:center
    }

    .viz-grid-2,.viz-grid-mix{display:grid;gap:6px;min-height:0}
    .viz-grid-2{grid-template-columns:1fr 1fr}
    .viz-grid-mix{grid-template-columns:1.15fr .85fr}
    .viz-panel{
      background:var(--panel-soft);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:0;transition:background-color .18s ease,border-color .18s ease
    }
    .viz-title{margin-bottom:6px}

    .bars{display:flex;align-items:flex-end;gap:6px;height:76px}
    .bars.tall{height:132px}
    .bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
    .bar-item .num{font-size:9px;font-weight:700;color:var(--text);margin-bottom:2px}
    .bar-item .bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;min-height:8px;background:#cbd5e1}
    .bar-item .lab{margin-top:3px;font-size:8px;color:var(--muted);line-height:1.2;text-align:center}

    .progress-list,.stack-list,.funnel-list,.risk-list,.opportunity-list,.vacancy-list,.project-board,.focus-list{display:flex;flex-direction:column;gap:7px}
    .progress-row,.stack-row,.funnel-row,.vacancy-row{
      display:grid;grid-template-columns:72px 1fr 38px;align-items:center;gap:8px
    }
    .progress-row .lab,.stack-row .lab,.funnel-row .lab,.vacancy-row .lab{font-size:10px;color:var(--sub)}
    .progress-row .num,.stack-row .num,.funnel-row .num,.vacancy-row .num{font-size:10px;color:var(--sub);text-align:right}
    .track,.stack-track{
      width:100%;height:8px;border-radius:999px;background:#e6edf5;overflow:hidden
    }
    .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
    .fill.purple{background:linear-gradient(90deg,var(--purple),var(--blue))}
    .fill.green{background:linear-gradient(90deg,var(--green),#b9d3ff)}
    .fill.amber{background:linear-gradient(90deg,var(--amber),#f0a43c)}
    .fill.red{background:linear-gradient(90deg,var(--red),#ef6b6b)}
    .stack-fill.red{background:var(--red)}
    .stack-fill.amber{background:var(--amber)}
    .stack-fill.cyan{background:var(--cyan)}
    .stack-fill.green{background:var(--green)}

    .list-item,.risk-item,.opportunity-item,.vacancy-item,.project-row{
      display:flex;justify-content:space-between;gap:10px;padding:8px 9px;border-radius:11px;
      background:#fff;border:1px solid var(--line);transition:background-color .18s ease,border-color .18s ease
    }
    .list-item strong,.risk-item strong,.opportunity-item strong,.vacancy-item strong,.project-row strong{font-size:11px;color:var(--text)}
    .list-item span,.risk-item span,.opportunity-item span,.vacancy-item span,.project-row span{font-size:10px;color:var(--sub);line-height:1.45}
    .risk-tag,.project-tag,.vacancy-tag{
      font-size:10px;font-weight:800;white-space:nowrap;align-self:flex-start
    }
    .risk-tag.high,.project-tag.risk,.vacancy-tag.high{color:var(--red)}
    .risk-tag.mid,.project-tag.warn,.vacancy-tag.mid{color:var(--amber)}
    .risk-tag.low,.project-tag.good,.vacancy-tag.low{color:var(--blue)}

    .donut-wrap{display:flex;gap:10px;align-items:center}
    .donut{
      width:92px;height:92px;border-radius:50%;position:relative;display:grid;place-items:center;flex-shrink:0
    }
    .donut::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}
    .donut-core{position:relative;z-index:1;text-align:center}
    .donut-core .big{font-size:17px;font-weight:800;line-height:1.05}
    .donut-core .small{margin-top:3px;font-size:10px;color:var(--sub)}
    .legend{display:flex;flex-direction:column;gap:7px;flex:1}
    .legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:7px;align-items:center;font-size:10px;color:var(--sub)}
    .dot{width:10px;height:10px;border-radius:50%}

    .project-board{gap:6px}
    .project-row{padding:8px 8px}
    .project-row .main{display:flex;flex-direction:column;gap:3px;flex:1}
    .inline-meta{display:flex;flex-wrap:wrap;gap:8px}
    .inline-meta span{font-size:10px;color:var(--muted)}

    .delivery-grid{align-items:stretch}
    .delivery-chart{display:flex;flex-direction:column}
    .delivery-chart .bars.tall{flex:1;height:100%;min-height:176px}

    .solution-layout{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
    .solution-top{flex:1;align-items:stretch}
    .solution-top>.viz-panel{display:flex;flex-direction:column;min-height:0}
    .solution-top .opportunity-list{flex:1}
    .solution-top .donut-wrap{flex:1;min-height:176px;justify-content:center}
    .solution-top .donut{width:120px;height:120px}

    .modal-overlay{
      position:fixed;inset:0;background:rgba(15,23,42,.34);backdrop-filter:blur(4px);
      display:none;align-items:center;justify-content:center;z-index:999
    }
    .modal-overlay.open{display:flex}
    .modal{
      width:min(1500px,96vw);height:min(92vh,1000px);background:#fff;border:1px solid var(--line);
      border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden
    }
    .modal-head{
      display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;
      border-bottom:1px solid var(--line);background:#fbfdff
    }
    .modal-title{font-size:13px;font-weight:800}
    .modal-actions{display:flex;align-items:center;gap:8px}
    .modal-link{
      display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:999px;
      background:#eef4fb;color:var(--text);text-decoration:none;font-size:10px;font-weight:700;transition:background-color .18s ease,border-color .18s ease
    }
    .modal-close{
      width:28px;height:28px;border:none;border-radius:999px;background:#eef2f7;color:var(--text);
      font-size:16px;cursor:pointer;transition:background-color .18s ease
    }
    .modal-frame{flex:1;background:#fff}
    .modal-frame iframe{width:100%;height:100%;border:none;background:#fff}

    @media (max-width:1080px){
      .metric-grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .viz-grid-2,.viz-grid-mix{grid-template-columns:1fr}
      .solution-top .donut{width:104px;height:104px}
    }
    @media (max-width:760px){
      .metric-grid-3,.metric-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
      .dept-grid{grid-template-columns:1fr}
      .page{padding:10px}
      .modal{width:98vw;height:94vh}
    }
    @media (max-width:560px){
      .metric-grid-4,.metric-grid-3,.metric-grid-2{grid-template-columns:1fr}
    }

    .top-metric,
    .dept-card,
    .metric-box,
    .viz-panel,
    .list-item,
    .risk-item,
    .opportunity-item,
    .vacancy-item,
    .project-row,
    .modal {
      border-radius:12px !important;
    }

    .top-metric:hover,
    .dept-card:hover,
    .metric-box:hover,
    .viz-panel:hover,
    .list-item:hover,
    .risk-item:hover,
    .opportunity-item:hover,
    .vacancy-item:hover,
    .project-row:hover,
    .modal-link:hover,
    .modal-close:hover {
      background:#f5f5f5 !important;
    }
  </style>
</head>

      segments: [
        { label: "定制交付", value: 500, color: "#0052d9" },
        { label: "资源整合", value: 200, color: "#2f7bff" },
        { label: "产品/ODM", value: 100, color: "#79a8ff" }
      ]
    };
    departments.solution.opportunities = [
      { title: "东方锆联数字化工厂", desc: "500 万 | 赢单率 80% | 预计 2026-06" },
      { title: "中车风电 MES 系统", desc: "350 万 | 赢单率 65% | 预计 2026-07" },
      { title: "国电投核电项目", desc: "280 万 | 赢单率 50% | 预计 2026-08" },
      { title: "华新材料供应链平台", desc: "220 万 | 赢单率 55% | 预计 2026-07" },
      { title: "智造云客服中台", desc: "180 万 | 赢单率 45% | 预计 2026-09" }
    ];

    const app = document.getElementById("app");
    let activeDetail = null;

    function getBarMax(items){
      return Math.max(...items.map(item => item.value), 1);
    }

    function barChart(items, palette, variant = ""){
      const max = getBarMax(items);
      return `<div class="bars ${variant}">${items.map((item, idx) => `
        <div class="bar-item">
          <div class="num">${item.value}${item.unit || ""}</div>
          <div class="bar" style="height:${Math.max(item.value / max * 100, 10)}%;background:${palette[idx % palette.length]}"></div>
          <div class="lab">${item.label}</div>
        </div>
      `).join("")}</div>`;
    }

    function progressList(items, fillClass = "purple"){
      return `<div class="progress-list">${items.map(item => `
        <div class="progress-row">
          <div class="lab">${item.label}</div>
          <div class="track"><div class="fill ${fillClass}" style="width:${item.value}%"></div></div>
          <div class="num">${item.value}%</div>
        </div>
      `).join("")}</div>`;
    }

    function stackList(items){
      return `<div class="stack-list">${items.map(item => `
        <div class="stack-row">
          <div class="lab">${item.label}</div>
          <div class="stack-track"><div class="fill stack-fill ${item.cls}" style="width:${item.value / item.max * 100}%"></div></div>
          <div class="num">${item.value}${item.unit || ""}</div>
        </div>
      `).join("")}</div>`;
    }

    function donut(cfg){
      const total = cfg.segments.reduce((sum, item) => sum + item.value, 0);
      let cursor = 0;
      const stops = cfg.segments.map(item => {
        const start = cursor / total * 100;
        cursor += item.value;
        const end = cursor / total * 100;
        return `${item.color} ${start}% ${end}%`;
      }).join(",");
      return `<div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(${stops})">
          <div class="donut-core">
            <div class="big">${cfg.total}</div>
            <div class="small">${cfg.subtitle}</div>
          </div>
        </div>
        <div class="legend">${cfg.segments.map(item => `
          <div class="legend-row">
            <span class="dot" style="background:${item.color}"></span>
            <span>${item.label}</span>
            <strong>${item.value}</strong>
          </div>
        `).join("")}</div>
      </div>`;
    }

    function financeHtml(dept){
      return `
        <div class="metric-grid-4">${dept.metrics.map(item => `
          <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
        `).join("")}</div>
        <div class="viz-grid-2">
          <div class="viz-panel">
            <div class="viz-title">盈利与现金结构</div>
            ${barChart(dept.bars, ["#0052d9","#2f7bff","#79a8ff","#003a99"], "tall")}
          </div>
          <div class="viz-panel">
            <div class="viz-title">重点风险</div>
            <div class="risk-list">${dept.risks.map(item => `
              <div class="risk-item">
                <div><strong>${item.title}</strong><span>${item.desc}</span></div>
                <div class="risk-tag ${item.level}">${item.level === "high" ? "高" : item.level === "mid" ? "中" : "低"}</div>
              </div>
            `).join("")}</div>
          </div>
        </div>`;
    }

    function productHtml(dept){
      return `
        <div class="viz-grid-mix">
          <div class="viz-panel">
            <div class="viz-title">产品路标推进</div>
            ${progressList(dept.roadmap, "purple")}
          </div>
          <div class="viz-panel">
            <div class="viz-title">团队与质量</div>
            <div class="metric-grid-3">${dept.team.map(item => `
              <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
            `).join("")}</div>
          </div>
        </div>
        <div class="metric-grid-4">${dept.metrics.map(item => `
          <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
        `).join("")}</div>
        <div class="viz-panel">
          <div class="viz-title">产品质量分布</div>
          ${stackList(dept.bugs)}
        </div>`;
    }

    function deliveryHtml(dept){
      return `
        <div class="metric-grid-4">${dept.metrics.map(item => `
          <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
        `).join("")}</div>
        <div class="viz-grid-2 delivery-grid">
          <div class="viz-panel">
            <div class="viz-title">重点项目执行看板</div>
            <div class="project-board">${dept.projects.map(item => `
              <div class="project-row">
                <div class="main">
                  <strong>${item.title}</strong>
                  <div class="inline-meta">${item.meta.map(meta => `<span>${meta}</span>`).join("")}</div>
                </div>
                <div class="project-tag ${item.tone}">${item.tone === "good" ? "正常" : item.tone === "warn" ? "关注" : "风险"}</div>
              </div>
            `).join("")}</div>
          </div>
          <div class="viz-panel delivery-chart">
            <div class="viz-title">资源投放分布</div>
            ${barChart(dept.resources, ["#0052d9","#2f7bff","#4e8dff","#79a8ff","#003a99","#b9d3ff"], "tall")}
          </div>
        </div>`;
    }

    function solutionHtml(dept){
      return `
        <div class="viz-grid-mix">
          <div class="viz-panel">
            <div class="viz-title">合同与收入结构</div>
            ${donut(dept.donut)}
          </div>
          <div class="viz-panel">
            <div class="viz-title">关键商机</div>
            <div class="opportunity-list">${dept.opportunities.map(item => `
              <div class="opportunity-item">
                <div><strong>${item.title}</strong><span>${item.desc}</span></div>
              </div>
            `).join("")}</div>
          </div>
        </div>
        <div class="metric-grid-3">${dept.metrics.map(item => `
          <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
        `).join("")}</div>`;
    }

    function hrHtml(dept){
      return `
        <div class="metric-grid-4">${dept.metrics.map(item => `
          <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
        `).join("")}</div>
        <div class="viz-grid-2">
          <div class="viz-panel">
            <div class="viz-title">招聘漏斗</div>
            <div class="funnel-list">${dept.funnel.map((item, idx) => `
              <div class="funnel-row">
                <div class="lab">${item.label}</div>
                <div class="track"><div class="fill ${idx === 0 ? 'blue' : idx === 1 ? 'amber' : 'red'}" style="width:${item.value}%"></div></div>
                <div class="num">${item.value}%</div>
              </div>
            `).join("")}</div>
            <div class="focus-list" style="margin-top:7px">${dept.funnel.map(item => `
              <div class="list-item"><div><strong>${item.label}</strong><span>${item.text}</span></div></div>
            `).join("")}</div>
          </div>
          <div class="viz-panel">
            <div class="viz-title">部门缺口分布</div>
            <div class="vacancy-list">${dept.vacancies.map(item => `
              <div class="vacancy-item">
                <div><strong>${item.title}</strong><span>${item.desc}</span></div>
                <div class="vacancy-tag ${item.level}">${item.level === "high" ? "高" : item.level === "mid" ? "中" : "低"}</div>
              </div>
            `).join("")}</div>
          </div>
        </div>`;
    }

    function overviewHtml(){
      return `
        <div class="metric-grid-4">${topMetrics.map(item => `
          <div class="top-metric">
            <div class="label">${item.label}</div>
            <div class="value ${item.cls}">${item.value}</div>
            <div class="desc">${item.desc}</div>
          </div>
        `).join("")}</div>`;
    }

    function solutionHtml(dept){
      return `
        <div class="solution-layout">
          <div class="viz-grid-mix solution-top">
            <div class="viz-panel">
              <div class="viz-title">合同与收入结构</div>
              ${donut(dept.donut)}
            </div>
            <div class="viz-panel">
              <div class="viz-title">关键商机</div>
              <div class="opportunity-list">${dept.opportunities.map(item => `
                <div class="opportunity-item">
                  <div><strong>${item.title}</strong><span>${item.desc}</span></div>
                </div>
              `).join("")}</div>
            </div>
          </div>
          <div class="metric-grid-3">${dept.metrics.map(item => `
            <div class="metric-box"><div class="label">${item.label}</div><div class="value">${item.value}</div><div class="desc">${item.desc}</div></div>
          `).join("")}</div>
        </div>`;
    }

    function overviewHtml(){
      return `
        <div class="metric-grid-4 overview-grid">${topMetrics.map(item => `
          <div class="top-metric">
            <div class="label">${item.label}</div>
            <div class="value ${item.cls}">${item.value}</div>
            <div class="desc">${item.desc}</div>
          </div>
        `).join("")}</div>`;
    }

    function renderDeptCard(dept){
      const bodyMap = {
        overview: overviewHtml,
        finance: financeHtml,
        product: productHtml,
        delivery: deliveryHtml,
        solution: solutionHtml,
        hr: hrHtml
      };

      const statusHtml = dept.status?.text ? `<span class="status ${dept.status.tone}">${dept.status.text}</span>` : "";
      const actionsHtml = dept.file ? `
            <div class="dept-actions">
              ${statusHtml}
              <button class="more-btn" type="button" data-more="${dept.key}" aria-label="查看${dept.name}详情">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 16 16 8"></path>
                  <path d="M9 8h7v7"></path>
                </svg>
              </button>
            </div>` : `
            <div class="dept-actions">
              ${statusHtml}
            </div>`;

      return `
        <article class="dept-card ${dept.key}">
          <div class="dept-head">
            <div class="dept-title">
              <h3>${dept.name}</h3>
            </div>
            ${actionsHtml}
          </div>
          ${bodyMap[dept.key](dept)}
        </article>`;
    }

    function renderModal(){
      if (!activeDetail) return "";
      const dept = departments[activeDetail];
      return `
        <div class="modal-overlay open" id="detail-modal">
          <div class="modal">
            <div class="modal-head">
              <div>
                <div class="modal-title">${dept.name}详情</div>
              </div>
              <div class="modal-actions">
                <button class="modal-close" type="button" id="modal-close">×</button>
              </div>
            </div>
            <div class="modal-frame">
              <iframe title="${dept.name}详情" src="./${dept.file}"></iframe>
            </div>
          </div>
        </div>`;
    }

    function bindEvents(){
      document.querySelectorAll("[data-more]").forEach(btn => {
        btn.addEventListener("click", () => {
          activeDetail = btn.dataset.more;
          renderPage();
        });
      });

      const closeBtn = document.getElementById("modal-close");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          activeDetail = null;
          renderPage();
        });
      }

      const overlay = document.getElementById("detail-modal");
      if (overlay) {
        overlay.addEventListener("click", event => {
          if (event.target === overlay) {
            activeDetail = null;
            renderPage();
          }
        });
      }
    }

    function renderPage(){
      app.innerHTML = `
        <div class="topbar">
          <div class="crumb"><span class="current">经营数据看板</span></div>
        </div>
        <section class="dept-grid">${dashboardCards.map(renderDeptCard).join("")}</section>
        ${renderModal()}
      `;
      bindEvents();
    }

    renderPage();
  </script>
</body>
</html>
