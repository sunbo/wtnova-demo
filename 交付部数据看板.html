<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目交付详情</title>
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;
            --accent-color: #06b6d4;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .page-container {
            padding: 16px;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: var(--primary-color);
        }

        .breadcrumb .current {
            color: var(--text-primary);
            font-weight: 500;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            text-decoration: none;
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .file-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--success-color);
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 中间左右布局 */
        .middle-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: stretch;
        }

        .middle-layout .card {
            display: flex;
            flex-direction: column;
        }

        .middle-layout .card .card-body {
            flex: 1;
            overflow-y: auto;
        }

        /* 卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-title .icon {
            font-size: 16px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-body {
            padding: 14px 16px;
        }

        /* 甘特图样式 */
        .gantt-container {
            overflow-x: auto;
        }

        .gantt-chart {
            min-width: 900px;
        }

        .gantt-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: #f8fafc;
            position: sticky;
            top: 0;
        }

        .gantt-header-cell {
            padding: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            border-right: 1px solid var(--border-color);
        }

        .gantt-header-cell.project {
            width: 140px;
            text-align: left;
            flex-shrink: 0;
        }

        .gantt-header-cell.month {
            width: 60px;
            flex-shrink: 0;
        }

        .gantt-row {
            display: flex;
            border-bottom: 1px solid #f1f5f9;
            min-height: 36px;
        }

        .gantt-row:hover {
            background: #fafbfc;
        }

        .gantt-cell {
            padding: 4px 8px;
            font-size: 12px;
            border-right: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
        }

        .gantt-cell.project {
            width: 140px;
            font-weight: 500;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .gantt-cell.timeline {
            flex: 1;
            display: flex;
            position: relative;
            padding: 0;
        }

        .gantt-month {
            width: 60px;
            height: 100%;
            border-right: 1px solid #f1f5f9;
            position: relative;
            flex-shrink: 0;
        }

        .gantt-bar {
            position: absolute;
            height: 22px;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 4px;
            font-size: 10px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 6px;
            cursor: pointer;
        }

        .gantt-bar.dev {
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
        }

        .gantt-bar.test {
            background: linear-gradient(90deg, #06b6d4, #22d3ee);
        }

        .gantt-bar.online {
            background: linear-gradient(90deg, #10b981, #34d399);
        }

        .gantt-bar.accept {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }

        .gantt-bar.warranty {
            background: linear-gradient(90deg, #64748b, #94a3b8);
        }

        /* 进度概述 */
        .progress-overview {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 14px;
        }

        .progress-overview .overview-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .progress-overview .overview-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* 项目卡片列表 */
        .project-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .project-card {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid var(--border-color);
        }

        .project-card:hover {
            border-color: var(--primary-light);
        }

        .project-card .card-project-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .project-card .card-row {
            display: flex;
            margin-bottom: 8px;
        }

        .project-card .card-row:last-child {
            margin-bottom: 0;
        }

        .project-card .card-label {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 60px;
        }

        .project-card .card-value {
            font-size: 12px;
            color: var(--text-primary);
            flex: 1;
        }

        .project-card .card-value.risk {
            color: var(--danger-color);
            font-weight: 500;
        }

        /* 资源分布网格 */
        .resource-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .resource-item {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 14px;
        }

        .resource-item .item-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .resource-item .item-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .resource-item .pie-wrapper {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .resource-item .item-info {
            flex: 1;
        }

        .resource-item .percentage {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .resource-item .desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* 柱状图 */
        .bar-chart {
            height: 180px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 0;
        }

        .bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .bar-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            background: linear-gradient(180deg, var(--primary-color), var(--primary-light));
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.3s;
        }

        .bar-label {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            max-height: 60px;
            overflow: hidden;
        }

        .bar-value {
            font-size: 11px;
            color: var(--text-primary);
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
        }

        /* 回款统计 */
        .payment-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 14px;
        }

        .payment-stat-item {
            background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
            padding: 14px;
            border-radius: var(--radius-md);
            color: white;
            text-align: center;
        }

        .payment-stat-item.cyan {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        }

        .payment-stat-item.emerald {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .payment-stat-item.amber {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .payment-stat-item .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .payment-stat-item .stat-value {
            font-size: 22px;
            font-weight: 700;
        }

        .payment-stat-item .stat-unit {
            font-size: 12px;
            opacity: 0.9;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .data-table th {
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-primary);
        }

        .data-table tr:hover td {
            background: #fafbfc;
        }

        .data-table .text-center {
            text-align: center;
        }

        .data-table .text-right {
            text-align: right;
        }

        .data-table .amount {
            font-weight: 600;
            color: var(--primary-color);
        }

        .data-table .progress-cell {
            width: 100px;
        }

        .data-table .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .data-table .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 3px;
        }

        /* 表格滚动 */
        .table-scroll {
            max-height: 200px;
            overflow-y: auto;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .table-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .table-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .resource-grid {
                grid-template-columns: 1fr;
            }

            .middle-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 900px) {
            .payment-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .project-cards {
                grid-template-columns: 1fr;
            }
        }
        /* V3 unified compact detail style */

            --primary-light: #60a5fa;
            --primary-dark: #1d4ed8;

        }

        }

        }

        }

        .actions,
        .btn,

        .file-indicator {

        }

        .detail-meta {

        }

        .detail-meta strong {

        }

        .metric-card,
        .summary-card,
        .info-card,
        .progress-card,

        }

        :root {
            --bg-color: #fafafa;
        }

        body {
            background: #fafafa !important;
        }

        .btn:hover,
        .btn-primary:hover,
        .btn-outline:hover,
        .card:hover,
        .project-card:hover,
        .stat-item:hover,
        .summary-item:hover,

        }

        .btn-primary:hover {
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
            transform: none !important;
        }

        .data-table tr:hover td,
        tr:hover td {

        }

            --primary-color: #0052d9;
            --primary-light: #3d7dff;
            --primary-dark: #003a99;
            --accent-color: #79a8ff;
            --primary-soft: #e8f0ff;
            --primary-soft-strong: #cfe0ff;
            --bg-color: #f5f8fe;
            --card-bg: #ffffff;

            --text-secondary: #526077;
            --text-muted: #8c97aa;
            --border-color: #dde5ef;
            --success-color: #2f7bff;
            --warning-color: #d97706;
            --danger-color: #dc2626;
        }

        .file-indicator{background:var(--primary-soft)!important;border-color:var(--primary-soft-strong)!important;color:var(--primary-color)!important}

        }

        // 默认回款数据
        const defaultPaymentData = {

                { id: 1, project: '东锅APS项目', amount: 350, received: 180, node1: 60, node2: 50, node3: 40, node4: 30, nextDate: '2024-05-15' },
                { id: 2, project: '核电MES系统', amount: 280, received: 140, node1: 50, node2: 40, node3: 30, node4: 20, nextDate: '2024-05-20' },
                { id: 3, project: '风电计划系统', amount: 200, received: 80, node1: 40, node2: 30, node3: 20, node4: 10, nextDate: '2024-06-10' },

                { id: 5, project: 'IDME外包服务', amount: 180, received: 70, node1: 20, node2: 20, node3: 15, node4: 15, nextDate: '2024-04-30' },

        const getSheetNameV2 = (workbook, candidates) => candidates.find((name) => workbook.SheetNames.includes(name));
        const toNumberV2 = (value, fallback = 0) => {
            const num = Number(value);
            return Number.isFinite(num) ? num : fallback;
        };
        const toTextV2 = (value, fallback = '') => {
            if (value === null || value === undefined) return fallback;
            const text = String(value).trim();
            return text || fallback;
        };

        // 饼图组件
        const MiniPieChart = ({ data, colors, size = 80 }) => {
            const center = size / 2;
            const radius = size / 2 - 4;
            const innerRadius = radius * 0.6;

            let currentAngle = -90;
            const paths = [];
            const totalValue = Object.values(data).reduce((a, b) => a + b, 0);

            Object.values(data).forEach((value, index) => {
                const angle = (value / totalValue) * 360;
                const startAngle = currentAngle;
                const endAngle = currentAngle + angle;

                const startRad = (startAngle * Math.PI) / 180;
                const endRad = (endAngle * Math.PI) / 180;

                const x1 = center + radius * Math.cos(startRad);
                const y1 = center + radius * Math.sin(startRad);
                const x2 = center + radius * Math.cos(endRad);
                const y2 = center + radius * Math.sin(endRad);
                const x3 = center + innerRadius * Math.cos(endRad);
                const y3 = center + innerRadius * Math.sin(endRad);
                const x4 = center + innerRadius * Math.cos(startRad);
                const y4 = center + innerRadius * Math.sin(startRad);

                const largeArc = angle > 180 ? 1 : 0;
                const pathD = `M ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${x4} ${y4} Z`;

                paths.push(<path key={index} d={pathD} fill={colors[index]} />);
                currentAngle = endAngle;
            });

            return (
                <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                    {paths}
                </svg>
            );
        };

        // 甘特图组件
        const GanttChart = ({ data }) => {

            return (
                <div className="gantt-container">
                    <div className="gantt-chart">
                        <div className="gantt-header">
                            <div className="gantt-header-cell project">项目名称</div>
                            {months.map(m => (
                                <div key={m} className="gantt-header-cell month">{m}</div>
                            ))}
                        </div>
                        {data.map(item => (
                            <div key={item.id} className="gantt-row">
                                <div className="gantt-cell project">{item.project}</div>
                                <div className="gantt-cell timeline">

            );
        };

        // 项目整体进度卡片
        const GanttCard = ({ data }) => {

        // 项目进展&风险卡片
        const ProjectProgressCard = ({ data }) => {
            return (

                    <div className="card-body">

                        </div>
                        <div className="project-cards">
                            {data.projects.map(item => (
                                <div key={item.id} className="project-card">

                                    </div>

                                        <span className="card-label">风险问题:</span>
                                        <span className={`card-value ${item.risk ? 'risk' : ''}`}>
                                            {item.risk || '无'}
                                        </span>
                                    </div>
                                </div>
                            ))}

                    </div>
                </div>
            );

        // 交付资源分布卡片
        const ResourceCard = ({ data }) => {
            const maxDays = Math.max(...data.distribution.map(d => d.days));

            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-title">
                            <span className="icon">📊</span>
                            交付资源分布
                        </div>
                        <span className="card-subtitle">截止 {data.date}</span>
                    </div>
                    <div className="card-body">
                        <div className="resource-grid">
                            <div className="resource-item">
                                <div className="item-title">① 交付人天利用率</div>
                                <div className="item-content">
                                    <div className="pie-wrapper">
                                        <MiniPieChart
                                            data={{ delivery: data.utilization.delivery, other: data.utilization.other }}
                                            colors={['#0052d9', '#e6edf5']}
                                        />
                                    </div>
                                    <div className="item-info">
                                        <div className="percentage">{data.utilization.percentage}%</div>
                                        <div className="desc">{data.utilization.desc}</div>

        // 交付回款卡片

                            </div>

                        <div className="table-scroll">

        // 主应用组件
        const App = () => {
            const [ganttData, setGanttData] = useState(defaultGanttData);
            const [projectProgress, setProjectProgress] = useState(defaultProjectProgress);
            const [resourceData, setResourceData] = useState(defaultResourceData);
            const [paymentData, setPaymentData] = useState(defaultPaymentData);
            const [fileName, setFileName] = useState('');
            const fileInputRef = useRef(null);
            const updateTime = (() => {
                const now = new Date();
                const pad = (num) => String(num).padStart(2, '0');
                return `${now.getFullYear()}\u5e74${pad(now.getMonth() + 1)}\u6708${pad(now.getDate())}\u65e5 ${pad(now.getHours())}\u65f6${pad(now.getMinutes())}\u5206`;
            })();

            const handleFileUploadV2 = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setFileName(file.name);

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = event.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });

                        const ganttSheetName = getSheetNameV2(workbook, ['项目进度']);
                        if (ganttSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[ganttSheetName]);
                            const ganttRows = rows.map((row, idx) => {
                                const phases = [];
                                for (let i = 1; i <= 4; i += 1) {
                                    const name = toTextV2(row[`阶段${i}名称`]);
                                    if (!name) continue;
                                    phases.push({
                                        name,
                                        type: toTextV2(row[`阶段${i}类型`], 'dev'),
                                        start: toNumberV2(row[`阶段${i}开始月`], 1),
                                        end: toNumberV2(row[`阶段${i}结束月`], 1)
                                    });
                                }
                                return {
                                    id: idx + 1,
                                    project: toTextV2(row['项目名称']),
                                    phases
                                };
                            }).filter((item) => item.project && item.phases.length > 0);
                            if (ganttRows.length > 0) {
                                setGanttData(ganttRows);
                            }
                        }

                        const progressSheetName = getSheetNameV2(workbook, ['项目进展']);
                        if (progressSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[progressSheetName]);
                            if (rows.length > 0) {
                                setProjectProgress({
                                    overview: toTextV2(rows[0]['整体概述'], defaultProjectProgress.overview),
                                    projects: rows.filter((row) => row['项目名称']).map((row, idx) => ({
                                        id: idx + 1,
                                        name: toTextV2(row['项目名称']),
                                        progress: toTextV2(row['最新进展']),
                                        risk: toTextV2(row['风险问题'])
                                    }))
                                });
                            }
                        }

                        const resourceSheetName = getSheetNameV2(workbook, ['资源情况', '资源投放']);
                        if (resourceSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[resourceSheetName]);
                            if (rows.length > 0) {
                                const first = rows[0];
                                const distribution = rows.filter((row) => row['项目名称']).map((row) => ({
                                    project: toTextV2(row['项目名称']),
                                    days: toNumberV2(row['人天投入'])
                                }));
                                const planned = toNumberV2(first['计划投入'], defaultResourceData.overrun.planned);
                                const actual = toNumberV2(first['实际投入'], defaultResourceData.overrun.actual);
                                setResourceData({
                                    utilization: {
                                        delivery: toNumberV2(first['交付利用率'], defaultResourceData.utilization.delivery),
                                        other: toNumberV2(first['其他占比'], defaultResourceData.utilization.other),
                                        percentage: toNumberV2(first['交付利用率'], defaultResourceData.utilization.percentage),
                                        desc: toTextV2(first['利用率说明'], defaultResourceData.utilization.desc)
                                    },
                                    distribution: distribution.length > 0 ? distribution : defaultResourceData.distribution,
                                    outsourcing: {
                                        outsource: toNumberV2(first['外采占比'], defaultResourceData.outsourcing.outsource),
                                        internal: toNumberV2(first['内部占比'], defaultResourceData.outsourcing.internal),
                                        percentage: toNumberV2(first['外采占比'], defaultResourceData.outsourcing.percentage),
                                        desc: toTextV2(first['外采说明'], defaultResourceData.outsourcing.desc)
                                    },
                                    overrun: {
                                        planned,
                                        actual,
                                        percentage: actual > 0 ? Math.round((planned / actual) * 100) : defaultResourceData.overrun.percentage,
                                        desc: toTextV2(first['超投说明'], defaultResourceData.overrun.desc)
                                    },
                                    date: toTextV2(first['日期'], defaultResourceData.date)
                                });
                            }
                        }

                        const paymentSheetName = getSheetNameV2(workbook, ['回款明细']);
                        if (paymentSheetName) {
                            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[paymentSheetName]);
                            if (rows.length > 0) {
                                const details = rows.filter((row) => row['项目名称']).map((row, idx) => ({
                                    id: idx + 1,
                                    project: toTextV2(row['项目名称']),
                                    amount: toNumberV2(row['项目金额']),
                                    received: toNumberV2(row['累计回款']),
                                    node1: toNumberV2(row['回款节点1']),
                                    node2: toNumberV2(row['回款节点2']),
                                    node3: toNumberV2(row['回款节点3']),
                                    node4: toNumberV2(row['回款节点4']),
                                    nextDate: toTextV2(row['预计下次回款时间'])
                                }));
                                const first = rows[0];
                                const total = details.reduce((sum, item) => sum + item.amount, 0);
                                const received = details.reduce((sum, item) => sum + item.received, 0);
                                setPaymentData({
                                    total,
                                    received,
                                    rate: total > 0 ? Math.round((received / total) * 100) : 0,
                                    forecast: toNumberV2(first['半年度预测回款'], defaultPaymentData.forecast),
                                    details
                                });
                            }
                        }

                    } catch (error) {
                        console.error('解析Excel失败:', error);
                        alert('解析Excel文件失败，请检查文件格式');
                    }
                };

                reader.readAsBinaryString(file);
            };

            return (
                <div className="page-container">
                    <div className="top-bar">
                        <div className="detail-meta">

                            <span>更新时间：<strong>{updateTime}</strong></span>

                        <div className="actions">

                                <span>↓</span>
                                下载模板
                            </a>
                            <input
                                type="file"
                                ref={fileInputRef}
                                accept=".xls,.xlsx"
                                onChange={handleFileUploadV2}
                                style={{ display: 'none' }}
                            />
                            <button
                                className="btn btn-primary"
                                onClick={() => fileInputRef.current.click()}
                            >
                                <span>📤</span>
                                导入周报数据
                            </button>
                        </div>
                    </div>

                    <div className="main-content">
                        <GanttCard data={ganttData} />
                        <div className="middle-layout">
                            <ResourceCard data={resourceData} />
                            <ProjectProgressCard data={projectProgress} />
                        </div>
                        <PaymentCard data={paymentData} />
                    </div>
                </div>
            );
        };

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
